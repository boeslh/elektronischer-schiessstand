<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmeldung – Preisschießen</title>
<style>
:root {
  --bg:#12161b; --panel:#1b222b; --line:#2b3542; --text:#dce4ec;
  --dim:#75879a; --acc:#4ab8a0; --warn:#ffb347; --err:#e05c5c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header a{color:var(--dim);text-decoration:none;font-size:13px}
header a:hover{color:var(--text)}
header h1{font-size:19px;font-weight:700}
header select{background:#0e1218;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:6px 10px;font-size:.83rem;margin-left:auto}
main{flex:1;padding:20px;max-width:820px;margin:0 auto;width:100%}

.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px;margin-bottom:16px}
.card h2{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:14px}

label{display:block;font-size:.78rem;color:var(--dim);margin-bottom:4px;margin-top:10px}
label:first-of-type{margin-top:0}
input[type=text],input[type=date],input[type=search],input[type=number],select{
  width:100%;background:#0e1218;border:1px solid var(--line);border-radius:6px;
  color:var(--text);font-size:.85rem;padding:7px 10px
}
input:focus,select:focus{outline:none;border-color:var(--acc)}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-actions{display:flex;gap:8px;margin-top:14px}
.btn-save{background:var(--acc);border:none;border-radius:6px;color:#0d1a16;font-size:.83rem;font-weight:600;padding:8px 18px;cursor:pointer}
.btn-save:hover{opacity:.85}
.btn-save:disabled{opacity:.4;cursor:default}
.btn-cancel{background:none;border:1px solid var(--line);border-radius:6px;color:var(--dim);font-size:.83rem;padding:8px 14px;cursor:pointer}
.btn-link{background:none;border:none;color:var(--acc);font-size:.8rem;cursor:pointer;padding:0}

.search-results{background:#0e1218;border:1px solid var(--line);border-radius:6px;max-height:240px;overflow-y:auto;margin-top:8px}
.search-result-item{padding:9px 12px;cursor:pointer;font-size:.85rem;display:flex;justify-content:space-between;border-bottom:1px solid #1e2530}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover{background:#1e2530}
.search-result-item .club{color:var(--dim);font-size:.78rem}
.reg-badge{display:inline-block;background:#1a3a1a;color:#3dcc6e;border-radius:10px;padding:1px 8px;font-size:.72rem;font-weight:700;margin-right:8px}

.offer-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1e2530}
.offer-row:last-child{border-bottom:none}
.offer-row .name{font-size:.87rem}
.offer-row .price{color:var(--dim);font-size:.8rem;margin-left:8px}
.offer-row .items{color:var(--dim);font-size:.75rem;display:block}
.btn-buy{background:#1a2a1a;border:1px solid #2a4a2a;border-radius:4px;color:#4ab8a0;font-size:.78rem;padding:4px 10px;cursor:pointer}
.btn-buy:hover{background:#24401f}
.btn-ret{background:#2a1a1a;border:1px solid #4a2a2a;border-radius:4px;color:#e05c5c;font-size:.75rem;padding:3px 8px;cursor:pointer}

.saldo{font-size:1.6rem;font-weight:700;color:var(--acc)}
.saldo.neg{color:var(--err)}
.saldo-row{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.btn-pay{background:#1e2a38;border:1px solid var(--acc);border-radius:6px;color:var(--acc);font-size:.85rem;font-weight:600;padding:9px 18px;cursor:pointer}
.btn-pay:hover{background:#243040}
.pay-panel{background:#0e1218;border:1px solid var(--line);border-radius:8px;padding:14px;margin:10px 0}
.pay-panel h3{font-size:.85rem;color:var(--acc);margin-bottom:8px}
.hint{color:var(--dim);font-size:.82rem}
.msg{font-size:.82rem;padding:7px 10px;border-radius:6px;display:none;margin-top:8px}
.msg.ok{background:#1a3a2a;color:#4ab8a0}
.msg.err{background:#3a1a1a;color:#e05c5c}
.msg.info{background:#1a2a3a;color:#64b5f6}

.teilnehmer-badge{display:flex;align-items:center;justify-content:space-between;background:#0e1218;border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:14px}
.teilnehmer-badge .nr{font-size:1.3rem;font-weight:700;color:var(--acc)}
.teilnehmer-badge .name{font-size:.95rem}
.teilnehmer-badge .class{font-size:.78rem;color:var(--dim)}
</style>
</head>
<body>

<header>
  <a href="/">← Startseite</a>
  <h1>Anmeldung</h1>
  <select id="ps-select" onchange="onPSChange()"></select>
</header>

<main>
  <div id="no-ps" class="card" style="display:none">
    <p class="hint">Kein aktives Preisschießen vorhanden. <a href="/preisschiessen-bearbeiten" style="color:var(--acc)">Neues Preisschießen anlegen</a>.</p>
  </div>

  <div id="search-card" class="card">
    <h2>Mitglied suchen</h2>
    <input type="search" id="q" placeholder="Nachname oder Vorname…" oninput="searchShooters()">
    <div class="search-results" id="results" style="display:none"></div>
    <button type="button" class="btn-link" style="margin-top:10px" onclick="toggleNewMember()">+ Neues Mitglied anlegen</button>

    <div id="new-member-form" style="display:none;margin-top:12px">
      <label for="nm-last">Nachname *</label>
      <input type="text" id="nm-last" required>
      <div class="form-row2">
        <div><label for="nm-first">Vorname</label><input type="text" id="nm-first"></div>
        <div><label for="nm-birth">Geburtsdatum</label><input type="date" id="nm-birth"></div>
      </div>
      <div class="form-row2">
        <div><label for="nm-club">Verein</label><select id="nm-club"><option value="">– keiner –</option></select></div>
        <div><label for="nm-pass">Passnummer</label><input type="text" id="nm-pass"></div>
      </div>
      <label for="nm-gender">Geschlecht</label>
      <select id="nm-gender"><option value="">– unbekannt –</option><option value="M">männlich</option><option value="W">weiblich</option></select>
      <div class="form-actions">
        <button type="button" class="btn-save" onclick="createAndRegister()">Anlegen &amp; Anmelden</button>
        <button type="button" class="btn-cancel" onclick="toggleNewMember()">Abbrechen</button>
      </div>
    </div>
    <div id="search-msg" class="msg"></div>
  </div>

  <div id="konto-card" class="card" style="display:none">
    <h2>Teilnehmer</h2>
    <div class="teilnehmer-badge">
      <div>
        <div class="name" id="tk-name"></div>
        <div class="class" id="tk-class"></div>
      </div>
      <div class="nr" id="tk-nr"></div>
    </div>

    <div class="saldo-row">
      <div><label style="margin:0">Guthaben</label><span class="saldo" id="tk-saldo">0,00 €</span></div>
      <button type="button" class="btn-pay" onclick="openBezahlen()">💶 Bezahlen</button>
    </div>

    <!-- Bezahlvorgang: bewusst getrennter Schritt vom Kaufen, schließt den
         Warenkorb mit ein (siehe preisschiessen-kasse.html). -->
    <div id="bezahlen-panel" class="pay-panel" style="display:none">
      <h3>Bezahlen</h3>
      <p class="hint" id="pay-status"></p>
      <label for="pay-erhalten">Erhaltener Betrag (€)</label>
      <input type="number" id="pay-erhalten" step="0.01" min="0" value="0" oninput="updatePayPreview()">
      <p class="hint" id="pay-preview" style="margin-top:8px"></p>
      <div class="form-actions" id="pay-actions"></div>
      <div id="pay-result" class="msg"></div>
      <div class="form-actions">
        <button type="button" class="btn-cancel" onclick="closeBezahlen()">Schließen</button>
      </div>
    </div>
    <div id="tk-msg" class="msg"></div>

    <label style="margin-top:16px">Sets</label>
    <div id="tk-sets"></div>
    <label style="margin-top:16px">Einzelne Scheiben</label>
    <div id="tk-scheiben"></div>

    <!-- Warenkorb: 2-stufiger Kauf - erst hier sammeln, nichts wird gebucht
         bis "Buchen" (gegen vorhandenes Guthaben) oder ein abgeschlossener
         Bezahlvorgang die Positionen tatsächlich anlegt. -->
    <label style="margin-top:16px">Warenkorb</label>
    <div id="tk-cart"></div>
    <div class="form-actions">
      <button type="button" class="btn-save" id="cart-buchen-btn" onclick="buchWarenkorb()" disabled>Buchen</button>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" onclick="location.href='/preisschiessen-kasse'">Weiter zur Kasse</button>
      <button type="button" class="btn-cancel" onclick="resetFlow()">Nächster Teilnehmer</button>
    </div>
  </div>
</main>

<script src="/settings.js"></script>
<script>
const api = (path, opts) => fetch('/api'+path, opts).then(async r => {
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
});
const jsonOpts = (method, body) => ({method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text; el.className = 'msg ' + type; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}
function eur(n) { return (n || 0).toFixed(2).replace('.', ',') + ' €'; }

let psList = [];
let currentPS = null;
let currentTeilnehmer = null;
let searchTimer = null;
let registeredMap = {}; // shooter_id -> teilnehmer_nr, fuer bereits angemeldete Schuetzen im aktuellen Preisschiessen
let cart = []; // [{typ, id, name, price}] - rein clientseitig, bis Buchen/Bezahlen

async function loadPS() {
  psList = (await api('/preisschiessen') || []).filter(p => p.active);
  const sel = document.getElementById('ps-select');
  sel.innerHTML = psList.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  if (!psList.length) {
    document.getElementById('no-ps').style.display = 'block';
    document.getElementById('search-card').style.display = 'none';
    return;
  }
  const saved = localStorage.getItem('ps_current_id');
  sel.value = psList.some(p => p.id === saved) ? saved : psList[0].id;
  currentPS = psList.find(p => p.id === sel.value);
  localStorage.setItem('ps_current_id', currentPS.id);
  await loadRegisteredMap();
}

async function loadRegisteredMap() {
  registeredMap = {};
  if (!currentPS) return;
  const list = await api(`/preisschiessen/${currentPS.id}/teilnehmer`) || [];
  for (const t of list) registeredMap[t.shooter_id] = t.teilnehmer_nr;
}

async function onPSChange() {
  const sel = document.getElementById('ps-select');
  currentPS = psList.find(p => p.id === sel.value);
  localStorage.setItem('ps_current_id', currentPS.id);
  resetFlow();
  await loadRegisteredMap();
}

async function loadClubs() {
  const clubs = await api('/clubs') || [];
  const sel = document.getElementById('nm-club');
  sel.innerHTML = '<option value="">– keiner –</option>' + clubs.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
}

function searchShooters() {
  clearTimeout(searchTimer);
  const q = document.getElementById('q').value.trim();
  const results = document.getElementById('results');
  if (!q) { results.style.display = 'none'; return; }
  searchTimer = setTimeout(async () => {
    const list = await api('/shooters?q=' + encodeURIComponent(q)) || [];
    results.style.display = list.length ? 'block' : 'none';
    results.innerHTML = list.map(sh => {
      const nr = registeredMap[sh.id];
      const badge = nr !== undefined ? `<span class="reg-badge">#${nr}</span>` : '';
      return `
      <div class="search-result-item" onclick="registerShooter('${sh.id}')">
        <span>${badge}${esc(sh.last_name)}, ${esc(sh.first_name)}</span>
        <span class="club">${esc(sh.club || '')}</span>
      </div>`;
    }).join('');
  }, 250);
}

function toggleNewMember() {
  const form = document.getElementById('new-member-form');
  const show = form.style.display === 'none';
  form.style.display = show ? 'block' : 'none';
  if (show) loadClubs();
}

async function createAndRegister() {
  const last = document.getElementById('nm-last').value.trim();
  if (!last) { showMsg('search-msg', 'Nachname erforderlich', 'err'); return; }
  const body = {
    last_name: last,
    first_name: document.getElementById('nm-first').value.trim(),
    birth_date: document.getElementById('nm-birth').value,
    club_id: document.getElementById('nm-club').value,
    pass_no: document.getElementById('nm-pass').value.trim(),
    gender: document.getElementById('nm-gender').value,
    country: 'GER',
  };
  try {
    const res = await api('/shooters/full', jsonOpts('POST', body));
    await registerShooter(res.id);
  } catch(err) { showMsg('search-msg', 'Fehler: '+err.message, 'err'); }
}

async function registerShooter(shooterID) {
  if (!currentPS) return;
  if (registeredMap[shooterID] !== undefined) {
    showMsg('search-msg', `Bereits angemeldet als Teilnehmer #${registeredMap[shooterID]}.`, 'info');
    return;
  }
  try {
    currentTeilnehmer = await api(`/preisschiessen/${currentPS.id}/teilnehmer`, jsonOpts('POST', {shooter_id: shooterID}));
    registeredMap[shooterID] = currentTeilnehmer.teilnehmer_nr;
    document.getElementById('search-card').style.display = 'none';
    document.getElementById('konto-card').style.display = 'block';
    closeBezahlen();
    cart = [];
    renderCart();
    await refreshTeilnehmer();
  } catch(err) { showMsg('search-msg', 'Fehler: '+err.message, 'err'); }
}

async function refreshTeilnehmer() {
  currentTeilnehmer = await api(`/preisschiessen/${currentPS.id}/teilnehmer/${currentTeilnehmer.id}`);
  document.getElementById('tk-name').textContent = currentTeilnehmer.shooter_name;
  document.getElementById('tk-class').textContent = currentTeilnehmer.class_name || 'keine Klasse zugeordnet';
  document.getElementById('tk-nr').textContent = '#' + currentTeilnehmer.teilnehmer_nr;
  const saldoEl = document.getElementById('tk-saldo');
  saldoEl.textContent = eur(currentTeilnehmer.guthaben);
  saldoEl.classList.toggle('neg', currentTeilnehmer.guthaben < 0);
  if (document.getElementById('bezahlen-panel').style.display !== 'none') updatePayPreview();
  renderCart();
  await renderAngebot();
}

async function renderAngebot() {
  const {scheiben, sets} = await api(`/preisschiessen/${currentPS.id}/teilnehmer/${currentTeilnehmer.id}/angebot`);
  const setsEl = document.getElementById('tk-sets');
  setsEl.innerHTML = (sets && sets.length) ? sets.map(s => `
    <div class="offer-row">
      <div>
        <span class="name">${esc(s.name)}</span>
        <span class="items">${(s.items||[]).map(it => `${it.quantity}× ${esc(it.scheibe_name)}`).join(', ')}</span>
      </div>
      <div>
        <span class="price">${eur(s.price)}</span>
        <button class="btn-buy" onclick='addToCart("set","${s.id}",${JSON.stringify(s.name)},${s.price},${s.max_pro_teilnehmer ?? 'null'})'>In Warenkorb</button>
      </div>
    </div>`).join('') : '<p class="hint">Keine Sets verfügbar.</p>';

  const scheibenEl = document.getElementById('tk-scheiben');
  scheibenEl.innerHTML = (scheiben && scheiben.length) ? scheiben.map(sc => `
    <div class="offer-row">
      <span class="name">${esc(sc.name)}</span>
      <div><span class="price">${eur(sc.price)}</span>
      <button class="btn-buy" onclick='addToCart("scheibe","${sc.id}",${JSON.stringify(sc.name)},${sc.price},${sc.max_pro_teilnehmer ?? 'null'})'>In Warenkorb</button></div>
    </div>`).join('') : '<p class="hint">Keine einzelnen Scheiben verfügbar.</p>';
}

// ── Warenkorb (2-stufiger Kauf) ─────────────────────────────────────────
function addToCart(typ, id, name, price, maxProTeilnehmer) {
  if (maxProTeilnehmer != null) {
    const countInCart = cart.filter(c => c.typ === typ && c.id === id).length;
    if (countInCart >= maxProTeilnehmer) {
      showMsg('tk-msg', `Maximal ${maxProTeilnehmer}× möglich.`, 'err');
      return;
    }
  }
  cart.push({typ, id, name, price});
  renderCart();
}

function removeFromCart(i) {
  cart.splice(i, 1);
  renderCart();
}

function cartTotal() { return cart.reduce((s, c) => s + c.price, 0); }
function cartPayload() { return cart.map(c => c.typ === 'set' ? {typ:'set', set_id:c.id} : {typ:'scheibe', scheibe_id:c.id}); }

function renderCart() {
  const el = document.getElementById('tk-cart');
  el.innerHTML = cart.length ? cart.map((c, i) => `
    <div class="offer-row">
      <span class="name">${esc(c.name)}</span>
      <div><span class="price">${eur(c.price)}</span>
      <button class="btn-ret" onclick="removeFromCart(${i})">Entfernen</button></div>
    </div>`).join('') + `
    <div class="offer-row" style="font-weight:700"><span>Summe</span><span>${eur(cartTotal())}</span></div>`
    : '<p class="hint">Warenkorb ist leer.</p>';

  const buchenBtn = document.getElementById('cart-buchen-btn');
  buchenBtn.disabled = !cart.length || !currentTeilnehmer || currentTeilnehmer.guthaben < cartTotal();

  if (document.getElementById('bezahlen-panel').style.display !== 'none') updatePayPreview();
}

async function buchWarenkorb() {
  if (!cart.length) return;
  try {
    await api(`/preisschiessen/${currentPS.id}/teilnehmer/${currentTeilnehmer.id}/warenkorb/buchen`,
      jsonOpts('POST', {items: cartPayload()}));
    cart = [];
    renderCart();
    await refreshTeilnehmer();
    showMsg('tk-msg', 'Gebucht.', 'ok');
  } catch(err) { showMsg('tk-msg', 'Fehler: '+err.message, 'err'); }
}

// ── Bezahlen (bewusst getrennter Schritt, schließt den Warenkorb mit ein) ──
function openBezahlen() {
  document.getElementById('bezahlen-panel').style.display = 'block';
  document.getElementById('pay-erhalten').value = '';
  const resultEl = document.getElementById('pay-result');
  resultEl.style.display = 'none';
  resultEl.textContent = '';
  updatePayPreview();
}

function closeBezahlen() {
  document.getElementById('bezahlen-panel').style.display = 'none';
}

function updatePayPreview() {
  if (!currentTeilnehmer) return;
  const erhalten = parseFloat(document.getElementById('pay-erhalten').value) || 0;
  const saldo = currentTeilnehmer.guthaben;
  const wk = cartTotal();
  const neu = saldo + erhalten - wk;

  document.getElementById('pay-status').textContent =
    (saldo < 0 ? `Offener Betrag: ${eur(-saldo)}` : `Aktuelles Guthaben: ${eur(saldo)}`) +
    (wk > 0 ? ` · Warenkorb: ${eur(wk)}` : '');
  document.getElementById('pay-preview').textContent = `Guthaben nach Zahlung: ${eur(neu)}`;

  const actions = document.getElementById('pay-actions');
  if (neu > 0.004) {
    actions.innerHTML = `
      <button type="button" class="btn-cancel" onclick="finalizeBezahlen(false)">Rest als Guthaben behalten</button>
      <button type="button" class="btn-save" onclick="finalizeBezahlen(true)">Rückgeld auszahlen (${eur(neu)})</button>`;
  } else {
    actions.innerHTML = `<button type="button" class="btn-save" onclick="finalizeBezahlen(false)">Bezahlung buchen</button>`;
  }
}

async function finalizeBezahlen(restAuszahlen) {
  const betrag_erhalten = parseFloat(document.getElementById('pay-erhalten').value) || 0;
  try {
    const res = await api(`/preisschiessen/${currentPS.id}/teilnehmer/${currentTeilnehmer.id}/bezahlen`,
      jsonOpts('POST', {items: cartPayload(), betrag_erhalten, rest_auszahlen: restAuszahlen}));
    cart = [];
    renderCart();
    await refreshTeilnehmer();
    const resultEl = document.getElementById('pay-result');
    if (res.rueckgeld > 0) {
      resultEl.textContent = `Rückgeld: ${eur(res.rueckgeld)}`;
      resultEl.className = 'msg ok';
      resultEl.style.display = 'block';
    } else {
      resultEl.style.display = 'none';
      showMsg('tk-msg', 'Bezahlung gebucht.', 'ok');
    }
    document.getElementById('pay-erhalten').value = '';
    updatePayPreview();
  } catch(err) { showMsg('tk-msg', 'Fehler: '+err.message, 'err'); }
}

function resetFlow() {
  currentTeilnehmer = null;
  document.getElementById('search-card').style.display = 'block';
  document.getElementById('konto-card').style.display = 'none';
  document.getElementById('q').value = '';
  document.getElementById('results').style.display = 'none';
  document.getElementById('new-member-form').style.display = 'none';
  document.getElementById('nm-last').value = '';
  document.getElementById('nm-first').value = '';
  document.getElementById('nm-birth').value = '';
  document.getElementById('nm-pass').value = '';
  closeBezahlen();
  cart = [];
  renderCart();
}

(async function init() {
  await loadPS();
})();
</script>
<script src="/role.js"></script>
</body>
</html>
