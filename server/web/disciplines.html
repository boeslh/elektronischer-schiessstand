<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disziplinen – Schießstand</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #111; color: #e0e0e0; min-height: 100vh; }
header { background: #1a1a2e; border-bottom: 2px solid #e94560; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
header a.back { color: #e94560; text-decoration: none; font-size: 1.2rem; }
header a.back:hover { color: #ff6b81; }
header h1 { font-size: 1.4rem; color: #e94560; }
.container { max-width: 1430px; margin: 0 auto; padding: 24px 16px; display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
@media (max-width: 800px) { .container { grid-template-columns: 1fr; } }

/* --- List --- */
.card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 20px; }
.card h2 { font-size: 1rem; color: #a0a0c0; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 16px; }
.list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.list-header h2 { margin-bottom: 0; }
.btn-new { background: #e94560; color: #fff; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: .9rem; }
.btn-new:hover { background: #c73652; }
table { width: 100%; border-collapse: collapse; font-size: .82rem; }
th { text-align: left; color: #a0a0c0; font-weight: 500; padding: 5px 8px; border-bottom: 1px solid #2a2a4a; }
td { padding: 4px 8px; border-bottom: 1px solid #1e1e3a; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr.inactive td { color: #666; }
.badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: .72rem; }
.badge.active { background: #1a3a2a; color: #4caf50; }
.badge.inactive { background: #3a1a1a; color: #e57373; }
.badge.decimal { background: #1a2a3a; color: #64b5f6; }
.row-actions { white-space: nowrap; }
.btn-edit, .btn-del { border: none; border-radius: 5px; padding: 3px 8px; cursor: pointer; font-size: .75rem; margin-left: 4px; }
.btn-edit { background: #2a2a5a; color: #90caf9; }
.btn-edit:hover { background: #3a3a7a; }
.btn-del  { background: #3a1a1a; color: #ef9a9a; }
.btn-del:hover  { background: #5a2a2a; }

/* --- Form --- */
.form-card { position: sticky; top: 16px; }
.form-card h2 span { color: #e94560; }
form label { display: block; font-size: .8rem; color: #a0a0c0; margin-top: 12px; margin-bottom: 4px; }
form input[type=text],
form input[type=number],
form select,
form textarea { width: 100%; background: #111; border: 1px solid #3a3a5a; border-radius: 5px; color: #e0e0e0; padding: 7px 10px; font-size: .9rem; }
form input:focus, form select:focus, form textarea:focus { outline: none; border-color: #e94560; }
form textarea { resize: vertical; min-height: 56px; }
.form-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.check-row input[type=checkbox] { width: 16px; height: 16px; accent-color: #e94560; }
.check-row label { margin: 0; font-size: .9rem; color: #e0e0e0; }
.form-actions { margin-top: 20px; display: flex; gap: 10px; }
.btn-save { flex: 1; background: #e94560; color: #fff; border: none; border-radius: 6px; padding: 9px; cursor: pointer; font-size: .95rem; }
.btn-save:hover { background: #c73652; }
.btn-cancel { background: #2a2a4a; color: #a0a0c0; border: none; border-radius: 6px; padding: 9px 16px; cursor: pointer; font-size: .9rem; }
.btn-cancel:hover { background: #3a3a5a; }
.msg { margin-top: 10px; padding: 8px 12px; border-radius: 5px; font-size: .85rem; }
.msg.ok  { background: #1a3a2a; color: #81c784; }
.msg.err { background: #3a1a1a; color: #ef9a9a; }
.hint { font-size: .75rem; color: #666; margin-top: 3px; }
</style>
</head>
<body>
<header>
  <a class="back" href="/" title="Zurück">&#8592;</a>
  <h1>Disziplinen</h1>
</header>

<div class="container">
  <!-- ---- Liste ---- -->
  <div class="card">
    <div class="list-header">
      <h2>Alle Disziplinen</h2>
      <button class="btn-new" onclick="newDiscipline()">+ Neue Disziplin</button>
    </div>
    <table id="disc-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Scheibe</th>
          <th>Wertung</th>
          <th>Probe</th>
          <th>Serie</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="disc-tbody"></tbody>
    </table>
  </div>

  <!-- ---- Formular ---- -->
  <div class="card form-card" id="form-card" style="display:none">
    <h2>Disziplin <span id="form-title">anlegen</span></h2>
    <form id="disc-form" onsubmit="saveForm(event)">
      <input type="hidden" id="f-id">

      <label for="f-name">Name *</label>
      <input type="text" id="f-name" placeholder="z.B. Luftgewehr 40 Schuss" required>

      <div class="form-row2">
        <div>
          <label for="f-ruleno">Regelnummer</label>
          <input type="text" id="f-ruleno" placeholder="z.B. 1.10">
        </div>
        <div>
          <label for="f-dist">Distanz (m)</label>
          <input type="number" id="f-dist" value="10" min="1" max="100" step="0.5">
        </div>
      </div>

      <label for="f-target">Scheibe *</label>
      <select id="f-target" required onchange="autoUpdateRMIIIString()">
        <option value="">– bitte wählen –</option>
      </select>

      <label for="f-scoring-mode">Wertungsart</label>
      <select id="f-scoring-mode" onchange="updateScoringModeFields()">
        <option value="elektronisch">Elektronisch (Stand-PC)</option>
        <option value="papier">Papierscheibe (Wertmaschine/manuell)</option>
        <option value="teilnahme">Teilnahme (kein Ergebnis, nur Anwesenheit)</option>
      </select>
      <div class="hint" id="scoring-mode-hint" style="display:none">
        Diese Disziplin darf nicht auf eine echte Stand-PC-Bahn zugewiesen werden -
        Erfassung erfolgt über die Disag-Wertmaschine oder manuelle Eingabe.
      </div>
      <div id="caliber-field" style="display:none">
        <label for="f-caliber">Kaliber (mm, nur Zentralfeuer)</label>
        <input type="number" id="f-caliber" step="0.01" min="0" placeholder="leer = nicht relevant">
      </div>
      <div id="rmiii-override-field" style="display:none">
        <label for="f-rmiii-override"
               title="Fest hinterlegter 9-stelliger Code für die RM-III-Wertmaschine (normaler Fernsteuermodus) - überschreibt die automatische Berechnung.">
          RM-III Einstellungsstring
        </label>
        <input type="text" id="f-rmiii-override" style="width:100%" placeholder="leer = automatisch berechnet" maxlength="30" oninput="syncRMIIISelectsFromString()">

        <label for="f-rmiv-override" style="margin-top:10px"
               title="Schlüssel-Wert-String für Wertmaschinen-PCs im RM-IV- bzw. RMIII-Win-Modus (siehe wertmaschine.json &quot;protocol&quot;) - unabhängig vom RM-III-String oben, eine Papierscheibe kann an unterschiedlichen Ständen mit unterschiedlichem Protokoll erfasst werden. Noch nicht an echter Hardware verifiziert.">
          RM-IV / RMIII-Win Einstellungsstring
        </label>
        <input type="text" id="f-rmiv-override" style="width:100%" placeholder="leer = automatisch berechnet">

        <div class="form-actions" style="margin-top:10px">
          <button type="button" class="btn-cancel" id="f-rm-default-btn"
                  title="Berechnet einen Vorschlagswert für BEIDE Felder aus den aktuellen Formularwerten (auch vor dem Speichern nutzbar) - ersetzt eine bereits manuell gewählte Scheibenlänge/Schuss-pro-Scheibe."
                  onclick="fillBothDefaults()">
            Standard einsetzen (beide Felder)
          </button>
        </div>

        <div class="form-row2" style="margin-top:10px">
          <div>
            <label for="f-rmiii-band" title="Wirkt sich auf beide Einstellungsstrings aus (RM-III Ziffer 2 bzw. RM-IV SCH=LGES/LG5/LG10).">Scheibenlänge</label>
            <select id="f-rmiii-band" onchange="onBandOrPercardChange()" disabled>
              <option value="1">Einzelscheibe</option>
              <option value="2">5er Band</option>
              <option value="3">10er Band</option>
            </select>
          </div>
          <div>
            <label for="f-rmiii-percard" title="Wirkt sich auf beide Einstellungsstrings aus (RM-III Ziffer 9 bzw. RM-IV SSC=).">Schuss/Scheibe</label>
            <select id="f-rmiii-percard" onchange="onBandOrPercardChange()" disabled>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="5">5 (nur Einzelscheibe)</option>
            </select>
          </div>
        </div>
        <label for="f-rmiii-printer" title="Nur RM-III (Ziffer 8) - im RM-IV-/RMIII-Win-Format gibt es dafür keine direkte Entsprechung.">Drucker/Aufdruck (nur RM-III)</label>
        <select id="f-rmiii-printer" onchange="applyRMIIIDigit(7, this)" disabled
                title="Nur aktiv, wenn oben ein gültiger (mind. 9-stelliger) RM-III-String steht.">
          <option value="1">Drucker eingeschaltet</option>
          <option value="2">Drucker ausgeschaltet</option>
          <option value="3">Teilerwert nicht aufdrucken</option>
        </select>
      </div>

      <div class="form-row2">
        <div>
          <label for="f-scoring">Wertungsschüsse *</label>
          <input type="number" id="f-scoring" value="40" min="1" max="999" required oninput="autoUpdateRMIIIString()">
        </div>
        <div>
          <label for="f-series">Schüsse/Serie</label>
          <input type="number" id="f-series" value="10" min="1" max="100" oninput="autoUpdateRMIIIString()">
        </div>
      </div>

      <label for="f-sighting">Probeschüsse</label>
      <input type="number" id="f-sighting" placeholder="leer = unbegrenzt" min="0" max="999">
      <div class="hint">Leer lassen für unbegrenzte Probe</div>

      <label for="f-time">Wertungszeit (Minuten)</label>
      <input type="number" id="f-time" placeholder="leer = keine Begrenzung" min="1" max="9999">

      <div class="check-row">
        <input type="checkbox" id="f-decimal" onchange="autoUpdateRMIIIString()">
        <label for="f-decimal">Zehntelwertung</label>
      </div>
      <div class="check-row">
        <input type="checkbox" id="f-active" checked>
        <label for="f-active">Aktiv</label>
      </div>

      <label for="f-anzeige">Anzeige am Stand-PC</label>
      <select id="f-anzeige">
        <option value="voll">Voll (Trefferbild + Ring/Zehntel/Teiler)</option>
        <option value="teilverdeckt">Teilverdeckt (nur Trefferbild, Werte als "-")</option>
        <option value="verdeckt">Verdeckt (nur "-", kein Trefferbild)</option>
      </select>

      <label for="f-notes">Notizen</label>
      <textarea id="f-notes" rows="2"></textarea>

      <div class="form-actions">
        <button type="submit" class="btn-save">Speichern</button>
        <button type="button" class="btn-cancel" onclick="cancelForm()">Abbrechen</button>
      </div>
      <div id="form-msg" style="display:none"></div>
    </form>
  </div>
</div>

<script>
let disciplines = [];
let targets = [];

async function load() {
  const [dRes, tRes] = await Promise.all([
    fetch('/api/disciplines/full'),
    fetch('/api/targets'),
  ]);
  disciplines = (await dRes.json()) || [];
  targets = (await tRes.json()) || [];
  renderTargetSelect();
  renderTable();
}

function renderTargetSelect(selectedID) {
  const sel = document.getElementById('f-target');
  const cur = selectedID || sel.value;
  sel.innerHTML = '<option value="">– bitte wählen –</option>';
  for (const t of targets) {
    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = t.name;
    if (t.id === cur) opt.selected = true;
    sel.appendChild(opt);
  }
}

function renderTable() {
  const tbody = document.getElementById('disc-tbody');
  tbody.innerHTML = '';
  for (const d of disciplines) {
    const tr = document.createElement('tr');
    if (!d.active) tr.className = 'inactive';
    const probe = d.max_sighting_shots != null ? d.max_sighting_shots : '∞';
    const timeMin = d.match_time_s != null ? Math.round(d.match_time_s/60) + ' min' : '–';
    tr.innerHTML = `
      <td><strong>${esc(d.name)}</strong>${d.rule_no ? `<br><small>${esc(d.rule_no)}</small>` : ''}</td>
      <td style="font-size:.8rem">${esc(d.target_name)}</td>
      <td>${d.match_shot_count}${d.decimal_scoring ? ' <span class="badge decimal">Z</span>' : ''}${d.anzeige && d.anzeige !== 'voll' ? ` <span class="badge decimal" title="Anzeige: ${esc(d.anzeige)}">${d.anzeige === 'verdeckt' ? 'V' : 'TV'}</span>` : ''}${d.scoring_mode === 'papier' ? ' <span class="badge decimal" title="Papierscheibe">P</span>' : ''}</td>
      <td>${probe}</td>
      <td>${d.shots_per_series}</td>
      <td>
        <span class="badge ${d.active ? 'active' : 'inactive'}">${d.active ? 'aktiv' : 'inaktiv'}</span>
      </td>
      <td class="row-actions">
        <button class="btn-edit" onclick="editRow('${d.id}')">Bearbeiten</button>
        <button class="btn-del" onclick="deleteRow('${d.id}', '${esc(d.name)}')">Löschen</button>
      </td>`;
    tbody.appendChild(tr);
  }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function newDiscipline() {
  clearForm();
  document.getElementById('form-title').textContent = 'anlegen';
  document.getElementById('form-card').style.display = 'block';
  document.getElementById('form-card').scrollIntoView({behavior:'smooth'});
}

function editRow(id) {
  const d = disciplines.find(x => x.id === id);
  if (!d) return;
  document.getElementById('form-card').style.display = 'block';
  document.getElementById('form-title').textContent = 'bearbeiten';
  document.getElementById('f-id').value = d.id;
  document.getElementById('f-name').value = d.name;
  document.getElementById('f-ruleno').value = d.rule_no || '';
  document.getElementById('f-dist').value = d.distance_m;
  renderTargetSelect(d.target_id);
  document.getElementById('f-scoring').value = d.match_shot_count;
  document.getElementById('f-series').value = d.shots_per_series;
  document.getElementById('f-sighting').value = d.max_sighting_shots != null ? d.max_sighting_shots : '';
  document.getElementById('f-time').value = d.match_time_s != null ? Math.round(d.match_time_s/60) : '';
  document.getElementById('f-decimal').checked = d.decimal_scoring;
  document.getElementById('f-active').checked = d.active;
  document.getElementById('f-anzeige').value = d.anzeige || 'voll';
  document.getElementById('f-scoring-mode').value = d.scoring_mode || 'elektronisch';
  document.getElementById('f-caliber').value = d.wertmaschine_caliber_mm != null ? d.wertmaschine_caliber_mm : '';
  document.getElementById('f-rmiii-override').value = d.rmiii_config_override || '';
  document.getElementById('f-rmiv-override').value = d.rmiv_config_override || '';
  syncRMIIISelectsFromString();
  updateScoringModeFields();
  document.getElementById('f-notes').value = d.notes || '';
  hideMsg();
  document.getElementById('form-card').scrollIntoView({behavior:'smooth'});
}

// Wertungsart "papier": zeigt Hinweis + optionales Kaliber-Feld (nur fuer
// Zentralfeuer-Scheiben relevant, siehe server/wertmaschine_config.go KAL=).
function updateScoringModeFields() {
  const papier = document.getElementById('f-scoring-mode').value === 'papier';
  document.getElementById('scoring-mode-hint').style.display = papier ? 'block' : 'none';
  document.getElementById('caliber-field').style.display = papier ? 'block' : 'none';
  document.getElementById('rmiii-override-field').style.display = papier ? 'block' : 'none';
}

// fetchRMIIIPreview berechnet den RM-III-Einstellungsstring aus den
// aktuellen Formularwerten (Scheibe/Wertungsschuesse/Schuesse-pro-Serie/
// Zehntelwertung) - funktioniert auch bei einer neuen bzw. noch
// ungespeicherten Disziplin, da nicht von der gespeicherten DB-Zeile,
// sondern direkt vom Formular gelesen wird. Wirft bei fehlender Scheibe.
async function fetchRMIIIPreview() {
  const targetId = document.getElementById('f-target').value;
  if (!targetId) throw new Error('Bitte zuerst eine Scheibe auswählen.');
  const res = await fetch('/api/disciplines/rmiii-config-preview', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      target_id: targetId,
      match_shot_count: parseInt(document.getElementById('f-scoring').value) || 40,
      shots_per_series: parseInt(document.getElementById('f-series').value) || 10,
      decimal_scoring: document.getElementById('f-decimal').checked,
    }),
  });
  const j = await res.json();
  if (!res.ok) throw new Error(j.error || res.status);
  return j.config_string;
}

// fetchRMIVPreview berechnet den RM-IV/RMIII-Win-Einstellungsstring aus den
// aktuellen Formularwerten (siehe migrations/066) - eigener Preview-
// Endpunkt, da Format/Berechnung (SCH=...;-String) komplett anders ist als
// beim RM-III-Zifferncode. bandType/shotsPerCard=0 laesst den Server die
// automatische Heuristik anwenden (siehe disagBandHeuristic).
async function fetchRMIVPreview(bandType, shotsPerCard) {
  const targetId = document.getElementById('f-target').value;
  if (!targetId) throw new Error('Bitte zuerst eine Scheibe auswählen.');
  const caliber = document.getElementById('f-caliber').value;
  const res = await fetch('/api/disciplines/rmiv-config-preview', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      target_id: targetId,
      match_shot_count: parseInt(document.getElementById('f-scoring').value) || 40,
      shots_per_series: parseInt(document.getElementById('f-series').value) || 10,
      caliber_mm: caliber !== '' ? parseFloat(caliber) : null,
      band_type: bandType || 0,
      shots_per_card: shotsPerCard || 0,
    }),
  });
  const j = await res.json();
  if (!res.ok) throw new Error(j.error || res.status);
  return j.config_string;
}

// fillBothDefaults setzt den kompletten berechneten Vorschlagswert in BEIDE
// Felder ein (ueberschreibt auch bereits per Auswahlfeld gesetzte Werte) -
// fuer den gemeinsamen "Standard einsetzen"-Button, ein bewusster harter
// Reset je Feld (ein Fehler beim einen Feld verhindert nicht das Befuellen
// des anderen).
async function fillBothDefaults() {
  try {
    document.getElementById('f-rmiii-override').value = await fetchRMIIIPreview();
    syncRMIIISelectsFromString();
  } catch (err) {
    showMsg('RM-III-Standard konnte nicht ermittelt werden: ' + err.message, 'err');
  }
  try {
    document.getElementById('f-rmiv-override').value = await fetchRMIVPreview(0, 0);
  } catch (err) {
    showMsg('RM-IV-Standard konnte nicht ermittelt werden: ' + err.message, 'err');
  }
}

// autoUpdateRMIIIString haelt Ziffer 1 (Scheibentyp), 3 (Serie) und 4
// (Ringformat) automatisch mit Scheibe/Wertungsschuessen/Zehntelwertung
// synchron, sobald sich diese Formularfelder aendern - Ziffer 2 (Scheiben-
// laenge), 8 (Drucker) und 9 (Schuss/Scheibe) bleiben dabei die bisherige
// Bedienerwahl (reine Formularfelder, die nichts mit der Schusszahl zu tun
// haben). Greift nur, wenn bereits ein (mind. 9-stelliger) String im Feld
// steht - ohne bestehenden String gibt es nichts automatisch zu
// aktualisieren, dafuer dient weiterhin der "Standard einsetzen"-Button.
// Stoesst anschliessend auch das RM-IV-Feld an (siehe refreshRMIVIfPresent),
// da Wertungsschuesse/Schuesse-pro-Serie/Scheibe fuer beide Protokolle
// gleichermassen gelten.
async function autoUpdateRMIIIString() {
  if (document.getElementById('f-scoring-mode').value === 'papier') {
    const cur = document.getElementById('f-rmiii-override').value.trim();
    if (cur.length >= 9) {
      try {
        const fresh = await fetchRMIIIPreview();
        document.getElementById('f-rmiii-override').value = fresh[0] + cur[1] + fresh.slice(2, 7) + cur[7] + cur[8];
        syncRMIIISelectsFromString();
      } catch (err) {
        // Scheibe (noch) nicht gewaehlt o.ae. - still bleiben, kein
        // showMsg-Spam bei jedem Tastendruck.
      }
    }
  }
  await refreshRMIVIfPresent();
}

// refreshRMIVIfPresent berechnet das RM-IV-Feld neu (nur wenn bereits
// befuellt, analog zum RM-III-Verhalten oben) - beruecksichtigt dabei die
// aktuellen Werte der (fuer beide Felder gemeinsam genutzten) Scheiben-
// laenge-/Schuss-pro-Scheibe-Auswahlfelder, sofern diese schon aktiv sind
// (RM-III-String vorhanden, siehe syncRMIIISelectsFromString).
async function refreshRMIVIfPresent() {
  if (document.getElementById('f-scoring-mode').value !== 'papier') return;
  const field = document.getElementById('f-rmiv-override');
  if (!field.value.trim()) return;
  const active = !document.getElementById('f-rmiii-band').disabled;
  try {
    field.value = await fetchRMIVPreview(
      active ? parseInt(document.getElementById('f-rmiii-band').value, 10) : 0,
      active ? parseInt(document.getElementById('f-rmiii-percard').value, 10) : 0,
    );
  } catch (err) {
    // Scheibe (noch) nicht gewaehlt o.ae. - still bleiben.
  }
}

// Die Ziffern 2 (Scheibenlaenge), 8 (Drucker) und 9 (Schuss/Scheibe) des
// RM-III-Einstellungsstrings werden NICHT separat gespeichert (siehe
// computeRMIIIConfig/rmiii_config_override) - stattdessen lesen/schreiben
// diese Auswahlfelder direkt die entsprechende Stelle im Textfeld.
function syncRMIIISelectsFromString() {
  const s = document.getElementById('f-rmiii-override').value.trim();
  const valid = s.length >= 9;
  document.getElementById('f-rmiii-band').disabled = !valid;
  document.getElementById('f-rmiii-printer').disabled = !valid;
  document.getElementById('f-rmiii-percard').disabled = !valid;
  if (valid) {
    document.getElementById('f-rmiii-band').value = s[1];
    document.getElementById('f-rmiii-printer').value = s[7];
    document.getElementById('f-rmiii-percard').value = s[8];
  }
}

// onBandOrPercardChange: Scheibenlaenge/Schuss-pro-Scheibe sind jetzt fuer
// beide Einstellungsstrings gemeinsame Auswahlfelder - patcht die RM-III-
// Ziffern direkt (wie bisher) UND stoesst danach die RM-IV-Neuberechnung an.
function onBandOrPercardChange() {
  applyRMIIIDigit(1, document.getElementById('f-rmiii-band'));
  applyRMIIIDigit(8, document.getElementById('f-rmiii-percard'));
  refreshRMIVIfPresent();
}

function applyRMIIIDigit(index, selectEl) {
  const field = document.getElementById('f-rmiii-override');
  const s = field.value.trim();
  if (s.length < 9) return;
  field.value = s.slice(0, index) + selectEl.value + s.slice(index + 1);
}

function clearForm() {
  document.getElementById('form-title').textContent = 'anlegen';
  document.getElementById('f-id').value = '';
  document.getElementById('disc-form').reset();
  document.getElementById('f-dist').value = '10';
  document.getElementById('f-scoring').value = '40';
  document.getElementById('f-series').value = '10';
  document.getElementById('f-active').checked = true;
  document.getElementById('f-anzeige').value = 'voll';
  document.getElementById('f-scoring-mode').value = 'elektronisch';
  document.getElementById('f-caliber').value = '';
  document.getElementById('f-rmiii-override').value = '';
  document.getElementById('f-rmiv-override').value = '';
  syncRMIIISelectsFromString();
  updateScoringModeFields();
  renderTargetSelect('');
  hideMsg();
}

// cancelForm: Formular zuruecksetzen UND ausblenden (Abbrechen-Button) -
// anders als clearForm() allein (auch am Anfang von newDiscipline() genutzt,
// wo das Formular direkt danach wieder eingeblendet wird).
function cancelForm() {
  clearForm();
  document.getElementById('form-card').style.display = 'none';
}

function hideMsg() {
  const el = document.getElementById('form-msg');
  el.style.display = 'none';
  el.className = 'msg';
  el.textContent = '';
}

function showMsg(text, type) {
  const el = document.getElementById('form-msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = 'block';
}

async function saveForm(e) {
  e.preventDefault();
  const id = document.getElementById('f-id').value;
  const timeMin = document.getElementById('f-time').value;
  const sighting = document.getElementById('f-sighting').value;
  const body = {
    name:               document.getElementById('f-name').value.trim(),
    rule_no:            document.getElementById('f-ruleno').value.trim(),
    distance_m:         parseFloat(document.getElementById('f-dist').value) || 10,
    target_id:          document.getElementById('f-target').value,
    match_shot_count:   parseInt(document.getElementById('f-scoring').value) || 40,
    shots_per_series:   parseInt(document.getElementById('f-series').value) || 10,
    max_sighting_shots: sighting !== '' ? parseInt(sighting) : null,
    match_time_s:       timeMin !== '' ? Math.round(parseFloat(timeMin) * 60) : null,
    decimal_scoring:    document.getElementById('f-decimal').checked,
    active:             document.getElementById('f-active').checked,
    anzeige:            document.getElementById('f-anzeige').value,
    scoring_mode:       document.getElementById('f-scoring-mode').value,
    wertmaschine_caliber_mm: document.getElementById('f-caliber').value !== ''
      ? parseFloat(document.getElementById('f-caliber').value) : null,
    rmiii_config_override: document.getElementById('f-rmiii-override').value.trim(),
    rmiv_config_override: document.getElementById('f-rmiv-override').value.trim(),
    notes:              document.getElementById('f-notes').value.trim(),
  };

  const url    = id ? `/api/disciplines/${id}` : '/api/disciplines';
  const method = id ? 'PUT' : 'POST';
  try {
    const res = await fetch(url, {
      method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body),
    });
    if (!res.ok) {
      const txt = await res.text();
      showMsg('Fehler: ' + txt, 'err');
      return;
    }
    showMsg(id ? 'Gespeichert.' : 'Disziplin angelegt.', 'ok');
    clearForm();
    document.getElementById('form-card').style.display = 'none';
    await load();
  } catch (err) {
    showMsg('Netzwerkfehler: ' + err.message, 'err');
  }
}

async function deleteRow(id, name) {
  if (!confirm(`Disziplin "${name}" wirklich löschen?\n\nHinweis: Löschen ist nur möglich, wenn keine Sitzungen auf diese Disziplin verweisen.`)) return;
  try {
    const res = await fetch(`/api/disciplines/${id}`, {method:'DELETE'});
    if (!res.ok) {
      const txt = await res.text();
      alert('Fehler: ' + txt);
      return;
    }
    await load();
  } catch (err) {
    alert('Netzwerkfehler: ' + err.message);
  }
}

load();
</script>
