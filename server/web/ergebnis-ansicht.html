<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grafische Ansicht – Schießstand</title>
<style>
  :root {
    --bg:#0f0f1a; --panel:#1a1a2e; --line:#2a2a45; --text:#e0e0f0;
    --dim:#7070a0; --acc:#7ba7ff; --green:#3dcc6e; --red:#e04040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, sans-serif; font-size: 14px;
    display: grid; grid-template-columns: 1fr 340px;
    grid-template-rows: auto 1fr; gap: 12px;
    height: 100vh; padding: 12px;
  }
  header {
    grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px;
    padding: 4px 8px;
  }
  header a.back { color: var(--dim); text-decoration: none; font-size: 18px; }
  header a.back:hover { color: var(--text); }
  header h1 { font-size: 17px; font-weight: 600; }
  #discipline { font-size: 13px; color: var(--dim); }
  #eventLine  { font-size: 12px; color: var(--acc); }
  #dateLine   { font-size: 12px; color: var(--dim); margin-left: auto; }

  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; overflow: hidden; }
  #targetWrap { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0;
                position: relative; }
  #correctionBanner {
    display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    align-items: center; gap: 12px; background: rgba(26,26,46,.92); border: 1px solid var(--acc);
    border-radius: 8px; padding: 7px 14px; font-size: 12px; color: var(--text);
    box-shadow: 0 4px 16px rgba(0,0,0,.4); white-space: nowrap; z-index: 10;
  }
  #correctionCoords { color: var(--acc); font-variant-numeric: tabular-nums; }
  #correctionBanner button {
    background: var(--line); color: var(--text); border: none; border-radius: 5px;
    padding: 4px 10px; font-size: 11px; cursor: pointer;
  }
  #correctionBanner button:hover { background: var(--red); }

  /* ── Sidebar ── */
  #sidebar { display: flex; flex-direction: column; min-height: 0; }

  #summary {
    padding: 12px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  #summary .total { display: flex; align-items: baseline; gap: 8px; }
  #summary .total .tv { font-size: 30px; font-weight: 700; color: var(--acc); }
  #summary .total .tl { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  #summary .sub { font-size: 12px; color: var(--dim); margin-top: 4px; }

  /* ── Zoom-Leiste ── */
  #zoomBar {
    display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px;
    border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .zoom-btn {
    font-size: 11px; padding: 4px 8px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--dim);
  }
  .zoom-btn:hover { color: var(--text); border-color: var(--dim); }
  .zoom-btn.active { color: #0c1410; background: var(--acc); border-color: var(--acc); font-weight: 600; }

  /* ── Auswahl-Leiste ── */
  #origToggleBar {
    padding: 6px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0;
    font-size: 12px; color: var(--dim);
  }
  #origToggleBar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #origToggleBar input { accent-color: #3dcc6e; cursor: pointer; }

  #selectBar {
    padding: 6px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0;
    font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 8px;
  }
  #selectBar .hint { flex: 1; }
  #selectBar button {
    font-size: 11px; padding: 3px 10px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  #selectBar button:hover { border-color: var(--acc); color: var(--acc); }

  /* ── Schussliste ── */
  #list { flex: 1; overflow-y: auto; }
  .grp-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px; cursor: pointer; background: var(--bg);
    border-bottom: 1px solid var(--line); position: sticky; top: 0;
  }
  .grp-head:hover { background: #202038; }
  .grp-head.active { background: var(--acc); color: #0c1410; }
  .grp-head .gn { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .grp-head .gv { font-size: 15px; font-weight: 700; }
  .grp-head.active .gv { color: #0c1410; }

  #list table { width: 100%; border-collapse: collapse; }
  #list td { padding: 5px 12px; text-align: right; font-size: 13px;
             border-bottom: 1px solid var(--line); cursor: pointer; }
  #list td:first-child { text-align: left; color: var(--dim); width: 28px; }
  #list tr:hover td { background: #202038; }
  #list tr.active td { background: var(--acc); color: #0c1410; }
  #list tr.annulled td { opacity: .5; text-decoration: line-through; }
  #list tr.ten td:nth-child(2) { color: var(--green); font-weight: 700; }
  #list tr.active.ten td:nth-child(2) { color: #0c1410; }
  #list tr.corrected td:nth-child(2) { box-shadow: inset 2px 0 0 #3dcc6e; padding-left: 10px; }

  #empty { padding: 40px 20px; text-align: center; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>

<header>
  <a class="back" href="/ergebnisse" title="Zurück zu den Ergebnissen">←</a>
  <h1 id="shooterName">–</h1>
  <span id="discipline"></span>
  <span id="eventLine"></span>
  <span id="dateLine"></span>
</header>

<div class="panel" id="targetWrap">
  <svg id="target" viewBox="-30 -30 60 60" width="90%" height="90%"></svg>
  <div id="correctionBanner">
    <span id="correctionLabel"></span>
    <span id="correctionCoords">x: – / y: –</span>
    <button type="button" onclick="cancelCorrection()">Abbrechen (Esc)</button>
  </div>
</div>

<div class="panel" id="sidebar">
  <div id="summary">
    <div class="total">
      <span class="tv" id="totVal">–</span>
      <span class="tl">Gesamt</span>
    </div>
    <div class="sub" id="totSub"></div>
  </div>

  <div id="zoomBar"></div>

  <div id="origToggleBar" style="display:none">
    <label>
      <input type="checkbox" id="origToggle" onchange="setShowOriginal(this.checked)">
      Originalwerte anzeigen (statt Korrektur)
    </label>
  </div>

  <div id="selectBar">
    <span class="hint" id="selectHint">Alle Schüsse</span>
    <button id="resetBtn" onclick="selectScope(null)">Alle anzeigen</button>
  </div>

  <div id="list"></div>
</div>

<script>
// ── Konstanten (wie Standpc-Schützenanzeige) ────────────────────────────────
const CALIBER = 4.5; // Kaliberdurchmesser mm (4,5 mm Diabolo)
// SVG-Strokes liegen mittig auf dem Pfad (halb innen/halb außen) - der
// Kreisradius wird um die halbe Randbreite verkleinert, damit die
// AUSSENkante von Fläche+Rand exakt CALIBER entspricht (kein optisch
// vergrößerter Schuss durch den Rand).
const SHOT_STROKE_W = CALIBER * 0.05;
const SHOT_R = CALIBER / 2 - SHOT_STROKE_W / 2;
const NS = 'http://www.w3.org/2000/svg';
const COLORS = {
  ring10: '#e04040', ring9: '#f3fb06', other: '#4ab8ff', annulled: '#666666',
};
// Stufen-Radien als Bruchteil des Scheiben-Außenradius. Komplett (1.00) und
// Groß (0.60) sind fix, Mittel/Fein/Maximal linear (gleicher Abstand)
// gestaffelt darunter - kalibriert auf einen Schuss bei 8,5 Ringen/550
// Teiler (5,5 mm Abstand) auf der LG-10m-ISSF-Scheibe (Außenradius 22,75 mm,
// 5,5/22,75 ≈ 0,2418), der damit noch auf Stufe "Fein" landet statt wie
// zuvor auf "Mittel".
const ZOOM_OPTIONS = [
  {key: 'auto', label: 'Auto',     fraction: null},
  {key: '1',    label: 'Komplett', fraction: 1.00},
  {key: '2',    label: 'Groß',     fraction: 0.60},
  {key: '3',    label: 'Mittel',   fraction: 0.4209},
  {key: '4',    label: 'Fein',     fraction: 0.2418},
  {key: '5',    label: 'Maximal',  fraction: 0.0626},
];
const ZOOM_FIXED = ZOOM_OPTIONS.filter(z => z.fraction !== null)
                               .sort((a, b) => a.fraction - b.fraction);

// ── URL-Parameter ────────────────────────────────────────────────────────────
const params      = new URLSearchParams(location.search);
const sessionID    = params.get('session_id') || '';
const shotsPerSeries = parseInt(params.get('shots_per_series'), 10) || 10;
const decimalScoring = params.get('decimal') === '1';

document.getElementById('shooterName').textContent = params.get('shooter') || 'Schütze';
document.getElementById('discipline').textContent  = params.get('discipline') || '';
const evName  = params.get('event') || '';
const evType  = params.get('event_type') || '';
const EVENT_TYPE_DE = { einzel:'Einzelwettkampf', runde:'Rundenwettkampf', gruppe:'Gruppenwettkampf' };
document.getElementById('eventLine').textContent = evName
  ? (evType ? `${evName} · ${EVENT_TYPE_DE[evType] || evType}` : evName) : '';

const startedRaw = params.get('started');
if (startedRaw) {
  const dt = new Date(startedRaw);
  if (!isNaN(dt)) {
    document.getElementById('dateLine').textContent =
      dt.toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'}) + '  ' +
      dt.toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'});
  }
}

async function apiJSON(path, opts) {
  const r = await fetch(path, opts);
  const text = await r.text();
  if (!r.ok) {
    let msg = text;
    try { msg = JSON.parse(text).error || text; } catch (e) { /* kein JSON-Body */ }
    throw new Error(msg);
  }
  return text ? JSON.parse(text) : null;
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Korrigierte Werte (Simulator "Übernehmen" oder manuelle Revisor-Korrektur)
// haben Vorrang vor der Originalmessung - ueberall wo Position/Ring
// summiert oder dargestellt wird.
// showOriginal: globale Anzeige-Option (nicht pro Schuss) - zeigt bei true
// ueberall die Originalmessung statt einer evtl. vorhandenen Korrektur.
let showOriginal = false;
function isCorrected(s)       { return s.corrected_ring != null; }
function useCorrection(s)     { return !showOriginal && isCorrected(s); }
function effX(s)               { return useCorrection(s) ? s.corrected_x_mm : s.x_mm; }
function effY(s)               { return useCorrection(s) ? s.corrected_y_mm : s.y_mm; }
function effRing(s)            { return useCorrection(s) ? s.corrected_ring : s.ring; }
function effDecimal(s)         { return useCorrection(s) ? s.corrected_decimal : s.decimal; }
function effCenterDistance(s)  { return useCorrection(s) ? s.corrected_center_distance : s.center_distance; }
function effInnerTen(s)        { return useCorrection(s) ? !!s.corrected_inner_ten : s.inner_ten; }

// ── Zustand ─────────────────────────────────────────────────────────────────
let allShots      = [];   // alle nicht-technisch-verworfenen Schüsse, sortiert nach shot_no
let sightingShots  = [];
let scoringShots   = [];
let seriesGroups   = {};  // seriesNo -> shots[]
let seriesNos      = [];
let currentOuterR  = 0;
let zoomMode       = 'auto';
let selection      = null; // null | {type:'sighting'} | {type:'series', no} | {type:'shot', shotNo}

// ── Laden ────────────────────────────────────────────────────────────────────
async function init() {
  if (!sessionID) {
    document.getElementById('targetWrap').innerHTML =
      '<div id="empty">Keine session_id in der URL angegeben.</div>';
    return;
  }
  buildZoomBar();

  let shots, geo;
  try {
    [shots, geo] = await Promise.all([
      apiJSON(`/api/sessions/${sessionID}/shots`),
      fetch(`/api/sessions/${sessionID}/target-geometry`).then(r => r.ok ? r.json() : null),
    ]);
  } catch (e) {
    document.getElementById('targetWrap').innerHTML =
      `<div id="empty">Fehler beim Laden: ${esc(e.message)}</div>`;
    return;
  }

  buildTarget(geo);
  processShots(shots);
}

// Baut aus der rohen Schussliste die Gruppierung (Probe/Serien) und rendert
// Liste + Grafik neu. Wird sowohl beim Erstladen als auch nach einer
// Revisor-Korrektur (reloadShots) aufgerufen.
// Technisch verworfene/virtuelle Eintraege (kein echter Treffer, siehe
// v_scoring_shots) werden in Standard-Ansichten nie dargestellt - sonst
// verschieben sie die Serien-Nummerierung. Nur der Simulator zeigt sie.
const DISPLAY_STATUSES = ['valid', 'annulled', 'cross_shot_in'];

function processShots(shots) {
  const usable = (shots || []).filter(s => DISPLAY_STATUSES.indexOf(s.status) !== -1);

  sightingShots = usable.filter(s => s.kind === 'sighting');
  const scoring = usable.filter(s => s.kind !== 'sighting');

  seriesGroups = {};
  scoring.forEach((s, i) => {
    const no = Math.floor(i / shotsPerSeries) + 1;
    s.displayNo = i + 1; // Position innerhalb der Wertungsschüsse (Probe zählt nicht mit)
    if (!seriesGroups[no]) seriesGroups[no] = [];
    seriesGroups[no].push(s);
  });
  seriesNos = Object.keys(seriesGroups).map(Number).sort((a, b) => a - b);
  sightingShots.forEach((s, i) => { s.displayNo = i + 1; });

  allShots = [...sightingShots, ...scoring];
  scoringShots = scoring;

  if (!allShots.length) {
    document.getElementById('list').innerHTML =
      '<div id="empty">Noch keine Schüsse in dieser Session.</div>';
  }

  updateOrigToggleVisibility();
  renderSummary(scoring);
  renderList();
  renderShots(getVisibleShots());
  updateZoom();
}

// Die "Originalwerte anzeigen"-Option ist eine Einstellung fuer die gesamte
// Darstellung (nicht pro Schuss) und wird nur angezeigt, wenn ueberhaupt
// korrigierte Schuesse vorhanden sind.
function updateOrigToggleVisibility() {
  const hasCorrections = allShots.some(isCorrected);
  document.getElementById('origToggleBar').style.display = hasCorrections ? '' : 'none';
  if (!hasCorrections && showOriginal) {
    showOriginal = false;
    document.getElementById('origToggle').checked = false;
  }
}

function setShowOriginal(val) {
  showOriginal = val;
  renderSummary(scoringShots);
  renderList();
  renderShots(getVisibleShots());
  updateZoom();
}

async function reloadShots() {
  try {
    const shots = await apiJSON(`/api/sessions/${sessionID}/shots`);
    processShots(shots);
  } catch (e) {
    alert('Fehler beim Neuladen: ' + e.message);
  }
}

// ── Revisor: Trefferwert korrigieren ────────────────────────────────────────
// Klick-Korrektur: statt x/y als Zahl einzutippen, wird die Scheibe direkt
// angeklickt. Waehrend des Modus folgt ein Vorschaukreis (Durchmesser wie
// das Geschoss) der Maus, mit Live-Koordinaten-Anzeige.
let correctionMode = null; // {shotNo} waehrend des Klick-Modus, sonst null
let previewCircle = null;

function startCorrection(shotNo) {
  if (!window.SCHIESSSTAND_ROLE?.can_correct_results) return;
  if (!shotLayer) { alert('Scheibe noch nicht geladen.'); return; }
  if (correctionMode) endCorrection();

  correctionMode = { shotNo };
  const s = allShots.find(sh => sh.shot_no === shotNo);
  svg.style.cursor = 'crosshair';
  document.getElementById('correctionLabel').textContent =
    `Position für Schuss ${s ? s.displayNo : shotNo} auf der Scheibe anklicken`;
  document.getElementById('correctionCoords').textContent = 'x: – / y: –';
  document.getElementById('correctionBanner').style.display = 'flex';

  previewCircle = document.createElementNS(NS, 'circle');
  previewCircle.setAttribute('r', SHOT_R);
  previewCircle.setAttribute('fill', 'rgba(123,167,255,0.35)');
  previewCircle.setAttribute('stroke', '#7ba7ff');
  previewCircle.setAttribute('stroke-width', SHOT_STROKE_W);
  previewCircle.style.display = 'none';
  previewCircle.style.pointerEvents = 'none';
  correctionLayer.appendChild(previewCircle);

  svg.addEventListener('mousemove', onCorrectionMove);
  svg.addEventListener('click', onCorrectionClick);
  svg.addEventListener('mouseleave', onCorrectionLeave);
  document.addEventListener('keydown', onCorrectionKeydown);
}

// Rechnet Bildschirm- in Scheiben-Koordinaten (mm) um - beruecksichtigt den
// aktuellen Zoom/viewBox automatisch ueber die SVG-CTM-Matrix.
function screenToTarget(evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const ctm = svg.getScreenCTM();
  if (!ctm) return null;
  const loc = pt.matrixTransform(ctm.inverse());
  return { x: loc.x, y: -loc.y }; // y_mm ist im SVG invertiert (siehe renderShots)
}

function onCorrectionMove(evt) {
  const p = screenToTarget(evt);
  if (!p || !previewCircle) return;
  previewCircle.setAttribute('cx', p.x);
  previewCircle.setAttribute('cy', -p.y);
  previewCircle.style.display = '';
  document.getElementById('correctionCoords').textContent =
    `x: ${p.x.toFixed(1)} mm / y: ${p.y.toFixed(1)} mm`;
}

function onCorrectionLeave() {
  if (previewCircle) previewCircle.style.display = 'none';
}

async function onCorrectionClick(evt) {
  const p = screenToTarget(evt);
  if (!p || !correctionMode) return;
  const shotNo = correctionMode.shotNo;
  endCorrection();
  try {
    await apiJSON(`/api/sessions/${sessionID}/shots/${shotNo}/correct`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({x_mm: p.x, y_mm: p.y}),
    });
    await reloadShots();
  } catch (e) {
    alert('Fehler: ' + e.message);
  }
}

function onCorrectionKeydown(evt) {
  if (evt.key === 'Escape') cancelCorrection();
}

function cancelCorrection() { endCorrection(); }

function endCorrection() {
  if (!correctionMode) return;
  correctionMode = null;
  svg.style.cursor = '';
  document.getElementById('correctionBanner').style.display = 'none';
  svg.removeEventListener('mousemove', onCorrectionMove);
  svg.removeEventListener('click', onCorrectionClick);
  svg.removeEventListener('mouseleave', onCorrectionLeave);
  document.removeEventListener('keydown', onCorrectionKeydown);
  if (previewCircle) { previewCircle.remove(); previewCircle = null; }
}

async function revertShotCorrection(shotNo) {
  if (!window.SCHIESSSTAND_ROLE?.can_correct_results) return;
  if (!confirm('Korrektur wirklich entfernen? Der Originalwert gilt danach wieder.')) return;
  try {
    await apiJSON(`/api/sessions/${sessionID}/shots/${shotNo}/correct`, { method: 'DELETE' });
    await reloadShots();
  } catch (e) {
    alert('Fehler: ' + e.message);
  }
}

// ── Zusammenfassung ──────────────────────────────────────────────────────────
function seriesSum(list) {
  const rings   = list.reduce((a, s) => a + (s.status === 'valid' ? effRing(s) : 0), 0);
  const decimal = list.reduce((a, s) => a + (s.status === 'valid' ? (effDecimal(s) || effRing(s)) : 0), 0);
  return { rings, decimal };
}
function fmtSum(sum) { return decimalScoring ? sum.decimal.toFixed(1) : String(sum.rings); }

function renderSummary(scoring) {
  const sum = seriesSum(scoring);
  document.getElementById('totVal').textContent = scoring.length ? fmtSum(sum) : '–';
  const innerTens = scoring.filter(s => s.status === 'valid' && effInnerTen(s)).length;
  const parts = [];
  if (scoring.length) parts.push(`${scoring.length} Schuss${scoring.length === 1 ? '' : 'e'}`);
  if (innerTens > 0) parts.push(`${innerTens}× Innenzehner`);
  document.getElementById('totSub').textContent = parts.join(' · ');
}

// ── Zoom ─────────────────────────────────────────────────────────────────────
function buildZoomBar() {
  const bar = document.getElementById('zoomBar');
  bar.innerHTML = '';
  ZOOM_OPTIONS.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'zoom-btn' + (opt.key === zoomMode ? ' active' : '');
    btn.textContent = opt.label;
    btn.dataset.zoom = opt.key;
    btn.onclick = () => setZoomMode(opt.key);
    bar.appendChild(btn);
  });
}
function setZoomMode(key) {
  zoomMode = key;
  document.querySelectorAll('.zoom-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.zoom === key));
  updateZoom();
}
function applyZoomViewBox(r) {
  if (r <= 0) return;
  const pad = Math.max(r * 0.07, CALIBER * 0.8);
  svg.setAttribute('viewBox', `${-(r+pad)} ${-(r+pad)} ${2*(r+pad)} ${2*(r+pad)}`);
}
function computeViewR() {
  if (currentOuterR <= 0) return 0;
  if (zoomMode !== 'auto') {
    const lvl = ZOOM_OPTIONS.find(z => z.key === zoomMode);
    return lvl && lvl.fraction ? lvl.fraction * currentOuterR : currentOuterR;
  }
  // Auto: kleinste Stufe waehlen, bei der mindestens der MITTELPUNKT jedes
  // aktuell sichtbaren Schusses noch im Bild ist (der Rand des Geschoss-
  // kreises darf dabei ueber den Sichtbereich hinausragen).
  const visible = getVisibleShots();
  if (!visible.length) return currentOuterR;
  let maxR = 0;
  for (const s of visible) {
    const x = effX(s), y = effY(s);
    const d = Math.sqrt(x * x + y * y);
    maxR = Math.max(maxR, d);
  }
  for (const lvl of ZOOM_FIXED) {
    const r = lvl.fraction * currentOuterR;
    if (r >= maxR) return r;
  }
  return currentOuterR;
}
function updateZoom() { applyZoomViewBox(computeViewR()); }

// ── SVG-Scheibe (identisch zur Standpc-Schützenanzeige) ─────────────────────
const svg = document.getElementById('target');
let shotLayer;
let correctionLayer;

function buildTarget(target) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  shotLayer = null;
  currentOuterR = 0;
  if (!target || !target.rings || !target.rings.length) return;

  const rings  = [...target.rings].sort((a, b) => b.d - a.d);
  const outerR = rings[0].d / 2;
  currentOuterR = outerR;

  const strokeW = Math.max(outerR * 0.004, 0.08);
  let minStep = Infinity;
  for (let i = 0; i < rings.length - 1; i++)
    minStep = Math.min(minStep, (rings[i].d - rings[i+1].d) / 2);
  const fontSize = Math.max(minStep * 0.58, outerR * 0.045);

  const bg = document.createElementNS(NS, 'circle');
  bg.setAttribute('r', outerR);
  bg.setAttribute('fill', '#e8e4dc');
  svg.appendChild(bg);

  let darkR = 0;
  for (const r of rings) if (r.filled) darkR = Math.max(darkR, r.d / 2);
  if (darkR > 0) {
    const sp = document.createElementNS(NS, 'circle');
    sp.setAttribute('r', darkR);
    sp.setAttribute('fill', '#1c1c1c');
    svg.appendChild(sp);
  }

  for (const r of rings) {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', r.d / 2);
    c.setAttribute('fill', 'none');
    c.setAttribute('stroke', r.filled ? '#888' : '#555');
    c.setAttribute('stroke-width', strokeW);
    svg.appendChild(c);
  }

  if (target.inner10_d > 0) {
    const inn = document.createElementNS(NS, 'circle');
    inn.setAttribute('r', target.inner10_d / 2);
    inn.setAttribute('fill', 'none');
    inn.setAttribute('stroke', '#888');
    inn.setAttribute('stroke-width', strokeW);
    if (target.inner10_dashed) {
      const dl = strokeW * 5;
      inn.setAttribute('stroke-dasharray', `${dl} ${dl}`);
    }
    svg.appendChild(inn);
  }

  const labelPositions = [
    {nx: 0, ny: -1}, {nx: 1, ny: 0}, {nx: 0, ny: 1}, {nx: -1, ny: 0},
  ];
  for (let i = 0; i < rings.length; i++) {
    const r = rings[i];
    if (r.v < 1 || r.v > 9) continue;
    const outerRadius = r.d / 2;
    const innerRadius = (i + 1 < rings.length) ? rings[i + 1].d / 2 : 0;
    const labelR    = (outerRadius + innerRadius) / 2;
    const fillColor = r.filled ? '#bbb' : '#555';
    for (const p of labelPositions) {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', p.nx * labelR);
      t.setAttribute('y', p.ny * labelR);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('dominant-baseline', 'middle');
      t.setAttribute('font-size', fontSize);
      t.setAttribute('font-family', 'sans-serif');
      t.setAttribute('fill', fillColor);
      t.setAttribute('pointer-events', 'none');
      t.textContent = r.v;
      svg.appendChild(t);
    }
  }

  shotLayer = document.createElementNS(NS, 'g');
  svg.appendChild(shotLayer);

  // Eigener Layer fuer die Korrektur-Vorschau (Klick-Modus) - bleibt beim
  // Neuzeichnen der Schuesse (renderShots) unangetastet.
  correctionLayer = document.createElementNS(NS, 'g');
  svg.appendChild(correctionLayer);
}

function contrastColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.5 ? '#000000' : '#FFFFFF';
}
function shotColorByRing(s) {
  if (s.status !== 'valid') return COLORS.annulled;
  const ring = effRing(s);
  if (ring >= 10) return COLORS.ring10;
  if (ring === 9)  return COLORS.ring9;
  return COLORS.other;
}

function renderShots(list) {
  if (!shotLayer) return;
  while (shotLayer.firstChild) shotLayer.removeChild(shotLayer.firstChild);
  for (const s of list) {
    const fillColor = shotColorByRing(s);
    const x = effX(s), y = effY(s);
    const shown = useCorrection(s);
    const g = document.createElementNS(NS, 'g');
    if (s.status !== 'valid') g.setAttribute('opacity', '0.6');

    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', -y);
    c.setAttribute('r', SHOT_R);
    c.setAttribute('fill', fillColor);
    c.setAttribute('fill-opacity', '0.82');
    c.setAttribute('stroke', shown ? '#3dcc6e' : '#1a1a1a');
    c.setAttribute('stroke-width', SHOT_STROKE_W);

    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', x); t.setAttribute('y', -y);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'central');
    t.setAttribute('font-size', CALIBER * 0.42);
    t.setAttribute('font-family', 'sans-serif');
    t.setAttribute('font-weight', 'bold');
    t.setAttribute('fill', contrastColor(fillColor));
    t.setAttribute('pointer-events', 'none');
    t.textContent = String(s.displayNo);

    g.appendChild(c); g.appendChild(t);
    if (shown) {
      const title = document.createElementNS(NS, 'title');
      const orig = decimalScoring && s.decimal != null ? s.decimal.toFixed(1) : String(s.ring);
      title.textContent = `Korrigiert (Original: ${orig})`;
      g.appendChild(title);
    }
    shotLayer.appendChild(g);
  }
}

// ── Auswahl ──────────────────────────────────────────────────────────────────
function getVisibleShots() {
  if (!selection) return allShots;
  if (selection.type === 'sighting') return sightingShots;
  if (selection.type === 'series')   return seriesGroups[selection.no] || [];
  if (selection.type === 'shot')     return allShots.filter(s => s.shot_no === selection.shotNo);
  return allShots;
}

function scopeEquals(a, b) {
  if (!a || !b) return a === b;
  if (a.type !== b.type) return false;
  if (a.type === 'series') return a.no === b.no;
  if (a.type === 'shot')   return a.shotNo === b.shotNo;
  return true;
}

function selectScope(scope) {
  selection = scopeEquals(selection, scope) ? null : scope;
  renderList();
  renderShots(getVisibleShots());
  updateZoom();
}

// ── Schussliste ──────────────────────────────────────────────────────────────
function shotVal(s) {
  const dec = effDecimal(s);
  return decimalScoring && dec != null ? dec.toFixed(1) : String(effRing(s));
}

function groupHTML(scope, label, list) {
  const active = scopeEquals(selection, scope);
  const sum = seriesSum(list);
  let html = `<div class="grp-head${active ? ' active' : ''}" onclick='selectScope(${JSON.stringify(scope)})'>
    <span class="gn">${label}</span>
    <span class="gv">${fmtSum(sum)}</span>
  </div><table><tbody>`;
  for (const s of list) {
    const rowActive = selection && selection.type === 'shot' && selection.shotNo === s.shot_no;
    const cls = [rowActive ? 'active' : '', s.status !== 'valid' ? 'annulled' : '',
                 effRing(s) >= 10 ? 'ten' : '', useCorrection(s) ? 'corrected' : '']
      .filter(Boolean).join(' ');
    const cd = effCenterDistance(s);
    const origVal = decimalScoring && s.decimal != null ? s.decimal.toFixed(1) : String(s.ring);
    const valCell = useCorrection(s)
      ? `${shotVal(s)}<sup title="Original: ${origVal}" style="font-size:8px">✎</sup>`
      : shotVal(s);
    let actionBtns = '';
    if (window.SCHIESSSTAND_ROLE?.can_correct_results) {
      actionBtns = `<button type="button" title="Trefferwert korrigieren"
          onclick="event.stopPropagation();startCorrection(${s.shot_no})"
          style="font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid var(--line);
          background:var(--bg);color:var(--dim);cursor:pointer">✎</button>`;
      if (isCorrected(s)) {
        actionBtns += `<button type="button" title="Korrektur entfernen (Original wiederherstellen)"
          onclick="event.stopPropagation();revertShotCorrection(${s.shot_no})"
          style="font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid var(--line);
          background:var(--bg);color:var(--dim);cursor:pointer;margin-left:3px">↺</button>`;
      }
    }
    html += `<tr class="${cls}" onclick='selectScope({"type":"shot","shotNo":${s.shot_no}})'>
      <td>${s.displayNo}</td>
      <td>${valCell}</td>
      <td>${cd != null ? cd.toFixed(1) : '–'}</td>
      <td>${actionBtns}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  return html;
}

function renderList() {
  const el = document.getElementById('list');
  if (!allShots.length) return;
  let html = '';
  if (sightingShots.length) html += groupHTML({type: 'sighting'}, 'Probe', sightingShots);
  for (const no of seriesNos) html += groupHTML({type: 'series', no}, `Serie ${no}`, seriesGroups[no]);
  el.innerHTML = html;

  const hint = document.getElementById('selectHint');
  if (!selection) hint.textContent = `Alle Schüsse (${allShots.length})`;
  else if (selection.type === 'sighting') hint.textContent = `Probe (${sightingShots.length})`;
  else if (selection.type === 'series') hint.textContent = `Serie ${selection.no}`;
  else hint.textContent = `Schuss ${getVisibleShots()[0]?.displayNo ?? ''}`;
  document.getElementById('resetBtn').style.visibility = selection ? 'visible' : 'hidden';
}

init();
// role.js laedt/entscheidet die Korrektur-Berechtigung asynchron nach - Liste
// neu rendern, sobald sie feststeht (fuer den ✎-Korrektur-Button).
window.addEventListener('schiessstand-role-ready', () => { if (allShots.length) renderList(); });
</script>
<script src="/role.js"></script>
</body>
</html>
