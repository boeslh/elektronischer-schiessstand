<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teilnehmer – Preisschießen</title>
<style>
:root {
  --bg:#12161b; --panel:#1b222b; --line:#2b3542; --text:#dce4ec;
  --dim:#75879a; --acc:#4ab8a0; --warn:#ffb347; --err:#e05c5c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header a{color:var(--dim);text-decoration:none;font-size:13px}
header a:hover{color:var(--text)}
header h1{font-size:19px;font-weight:700}
header select{background:#0e1218;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:6px 10px;font-size:.83rem;margin-left:auto}
main{flex:1;padding:20px;max-width:1000px;margin:0 auto;width:100%}

.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px;margin-bottom:16px}
.card h2{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:14px}

label{display:block;font-size:.78rem;color:var(--dim);margin-bottom:4px;margin-top:10px}
label:first-of-type{margin-top:0}
input[type=search],select{
  width:100%;background:#0e1218;border:1px solid var(--line);border-radius:6px;
  color:var(--text);font-size:.85rem;padding:7px 10px
}
input:focus,select:focus{outline:none;border-color:var(--acc)}

table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--dim);font-weight:500;padding:5px 8px;font-size:.78rem;border-bottom:1px solid var(--line)}
td{padding:7px 8px;font-size:.83rem;border-bottom:1px solid #1e2530;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.tn-row{cursor:pointer}
tr.tn-row:hover td{background:#1e2530}
tr.tn-row.active td{background:#1a2a2a}

.btn-eval{background:#1a2030;border:1px solid #2a3a5a;border-radius:4px;color:#7ab0e0;font-size:.75rem;padding:3px 8px;cursor:pointer}
.btn-buy{background:#1a2a1a;border:1px solid #2a4a2a;border-radius:4px;color:#4ab8a0;font-size:.78rem;padding:4px 10px;cursor:pointer}
.btn-cancel{background:none;border:1px solid var(--line);border-radius:6px;color:var(--dim);font-size:.83rem;padding:8px 14px;cursor:pointer}
.row-actions{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}

.badge{border-radius:10px;padding:2px 9px;font-size:.7rem;font-weight:600;letter-spacing:.4px;white-space:nowrap}
.badge-gekauft{background:#1a2a3a;color:#64b5f6}
.badge-begonnen{background:#2e2510;color:#e8a030}
.badge-beendet{background:#1a3a2a;color:#4ab8a0}

.saldo{font-weight:700;color:var(--acc)}
.saldo.neg{color:var(--err)}
.hint{color:var(--dim);font-size:.82rem}
.msg{font-size:.82rem;padding:7px 10px;border-radius:6px;display:none;margin-top:8px}
.msg.ok{background:#1a3a2a;color:#4ab8a0}
.msg.err{background:#3a1a1a;color:#e05c5c}

.teilnehmer-badge{display:flex;align-items:center;justify-content:space-between;background:#0e1218;border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:14px}
.teilnehmer-badge .nr{font-size:1.3rem;font-weight:700;color:var(--acc)}
.teilnehmer-badge .name{font-size:.95rem}
.teilnehmer-badge .class{font-size:.78rem;color:var(--dim)}

.stand-form{display:flex;gap:6px;align-items:center}
.stand-form select{width:auto;min-width:110px}
</style>
</head>
<body>

<header>
  <a href="/">← Startseite</a>
  <h1>Teilnehmer</h1>
  <select id="ps-select" onchange="onPSChange()"></select>
</header>

<main>
  <div id="no-ps" class="card" style="display:none">
    <p class="hint">Kein aktives Preisschießen vorhanden. <a href="/preisschiessen-bearbeiten" style="color:var(--acc)">Neues Preisschießen anlegen</a>.</p>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <h2>Teilnehmer</h2>
      <input type="search" id="q" placeholder="Nummer oder Name suchen…" oninput="renderList()">
      <table style="margin-top:10px">
        <thead><tr><th>Nr.</th><th>Name</th><th>Klasse</th><th>Guthaben</th><th>Scheiben</th><th></th></tr></thead>
        <tbody id="tn-tbody"></tbody>
      </table>
    </div>

    <div id="detail-card" class="card" style="display:none">
      <h2>Details</h2>
      <div class="teilnehmer-badge">
        <div>
          <div class="name" id="d-name"></div>
          <div class="class" id="d-class"></div>
        </div>
        <div class="nr" id="d-nr"></div>
      </div>
      <p>Guthaben: <span class="saldo" id="d-saldo">0,00 €</span></p>

      <label style="margin-top:16px">Gekaufte Scheiben</label>
      <table>
        <thead><tr><th>Ser.-Nr.</th><th>Scheibe</th><th>Status</th><th>Schüsse</th><th>Stand</th><th></th></tr></thead>
        <tbody id="einheiten-tbody"></tbody>
      </table>
      <div id="d-msg" class="msg"></div>

      <div class="row-actions" style="margin-top:16px;justify-content:flex-start">
        <button type="button" class="btn-buy" onclick="gotoKasse()">Zur Kasse (Scheiben nachkaufen)</button>
        <button type="button" class="btn-cancel" onclick="closeDetail()">Schließen</button>
      </div>
    </div>
  </div>
</main>

<script src="/settings.js"></script>
<script>
const api = (path, opts) => fetch('/api'+path, opts).then(async r => {
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
});
const jsonOpts = (method, body) => ({method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text; el.className = 'msg ' + type; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}
function eur(n) { return (n || 0).toFixed(2).replace('.', ',') + ' €'; }

const STATUS_LABEL = {gekauft:'Gekauft', begonnen:'Begonnen', beendet:'Beendet'};

let psList = [];
let currentPS = null;
let teilnehmerList = [];
let selectedId = null;
let freeLanes = [];

async function loadPS() {
  psList = (await api('/preisschiessen') || []).filter(p => p.active);
  const sel = document.getElementById('ps-select');
  sel.innerHTML = psList.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  if (!psList.length) {
    document.getElementById('no-ps').style.display = 'block';
    document.getElementById('app').style.display = 'none';
    return;
  }
  document.getElementById('app').style.display = 'block';
  const saved = localStorage.getItem('ps_current_id');
  sel.value = psList.some(p => p.id === saved) ? saved : psList[0].id;
  currentPS = psList.find(p => p.id === sel.value);
  localStorage.setItem('ps_current_id', currentPS.id);
  await loadTeilnehmerList();
}

async function onPSChange() {
  const sel = document.getElementById('ps-select');
  currentPS = psList.find(p => p.id === sel.value);
  localStorage.setItem('ps_current_id', currentPS.id);
  closeDetail();
  await loadTeilnehmerList();
}

async function loadTeilnehmerList() {
  teilnehmerList = await api(`/preisschiessen/${currentPS.id}/teilnehmer`) || [];
  renderList();
}

function renderList() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const tbody = document.getElementById('tn-tbody');
  const filtered = !q ? teilnehmerList : teilnehmerList.filter(t =>
    t.shooter_name.toLowerCase().includes(q) || String(t.teilnehmer_nr) === q);
  tbody.innerHTML = '';
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="color:var(--dim);text-align:center">Keine Teilnehmer</td></tr>';
    return;
  }
  for (const t of filtered) {
    const tr = document.createElement('tr');
    tr.className = 'tn-row' + (t.id === selectedId ? ' active' : '');
    tr.innerHTML = `
      <td>#${t.teilnehmer_nr}</td>
      <td>${esc(t.shooter_name)}</td>
      <td style="font-size:.8rem">${esc(t.class_name || '–')}</td>
      <td class="saldo ${t.guthaben < 0 ? 'neg' : ''}" style="font-size:.83rem">${eur(t.guthaben)}</td>
      <td style="font-size:.8rem">${t.scheiben_count}</td>
      <td class="row-actions"><button class="btn-eval" onclick="openKasseDirect('${t.id}');event.stopPropagation()">Kasse</button></td>`;
    tr.onclick = () => selectTeilnehmer(t.id);
    tbody.appendChild(tr);
  }
}

async function selectTeilnehmer(id) {
  selectedId = id;
  renderList();
  document.getElementById('detail-card').style.display = 'block';
  await refreshDetail();
  document.getElementById('detail-card').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function closeDetail() {
  selectedId = null;
  document.getElementById('detail-card').style.display = 'none';
  renderList();
}

async function refreshDetail() {
  const [t, einheiten, lanes] = await Promise.all([
    api(`/preisschiessen/${currentPS.id}/teilnehmer/${selectedId}`),
    api(`/preisschiessen/${currentPS.id}/teilnehmer/${selectedId}/scheiben-einheiten`),
    api('/lanes'),
  ]);
  document.getElementById('d-name').textContent = t.shooter_name;
  document.getElementById('d-class').textContent = t.class_name || 'keine Klasse zugeordnet';
  document.getElementById('d-nr').textContent = '#' + t.teilnehmer_nr;
  const saldoEl = document.getElementById('d-saldo');
  saldoEl.textContent = eur(t.guthaben);
  saldoEl.classList.toggle('neg', t.guthaben < 0);

  freeLanes = (lanes || []).filter(l => l.active && !l.session_id).map(l => l.lane_no).sort((a,b) => a-b);

  const tbody = document.getElementById('einheiten-tbody');
  tbody.innerHTML = (einheiten && einheiten.length) ? einheiten.map(e => {
    const standCell = e.lane_no ? `Stand ${e.lane_no}` :
      (e.status === 'gekauft' ? standAssignHTML(e.id) : '–');
    return `
      <tr>
        <td>#${e.serial_no}</td>
        <td>${esc(e.scheibe_name)}</td>
        <td><span class="badge badge-${e.status}">${STATUS_LABEL[e.status]||e.status}</span></td>
        <td style="font-size:.8rem">${e.shot_count}/${e.required_shots}</td>
        <td style="font-size:.82rem">${standCell}</td>
        <td></td>
      </tr>`;
  }).join('') : '<tr><td colspan="6" style="color:var(--dim);text-align:center">Keine Scheiben gekauft</td></tr>';
}

function standAssignHTML(einheitID) {
  if (!freeLanes.length) return '<span class="hint">Keine freien Stände</span>';
  return `
    <div class="stand-form">
      <select id="stand-sel-${einheitID}">
        ${freeLanes.map(no => `<option value="${no}">Stand ${no}</option>`).join('')}
      </select>
      <button class="btn-buy" onclick="assignStand('${einheitID}')">Zuweisen</button>
    </div>`;
}

async function assignStand(einheitID) {
  const sel = document.getElementById('stand-sel-' + einheitID);
  const laneNo = parseInt(sel.value, 10);
  try {
    await api(`/preisschiessen/${currentPS.id}/scheiben-einheiten/${einheitID}/stand`, jsonOpts('POST', {lane_no: laneNo}));
    await refreshDetail();
    await loadTeilnehmerList();
    showMsg('d-msg', `Stand ${laneNo} zugewiesen.`, 'ok');
  } catch(err) { showMsg('d-msg', 'Fehler: '+err.message, 'err'); }
}

function gotoKasse() {
  if (!selectedId) return;
  localStorage.setItem('ps_kasse_open_teilnehmer_id', selectedId);
  location.href = '/preisschiessen-kasse';
}

function openKasseDirect(tid) {
  localStorage.setItem('ps_kasse_open_teilnehmer_id', tid);
  location.href = '/preisschiessen-kasse';
}

(async function init() {
  await loadPS();
})();
</script>
<script src="/role.js"></script>
</body>
</html>
