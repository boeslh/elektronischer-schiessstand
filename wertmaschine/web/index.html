<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wertmaschine</title>
<style>
  :root{--bg:#11151a;--panel:#1a2028;--line:#2a3340;--text:#d8e0e8;--dim:#6a7888;--acc:#4ab8a0;--warn:#e8a030;--err:#e05c5c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:20px}
  h1{font-size:1.2em;margin:0 0 16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:.8em;color:var(--dim);margin:8px 0 4px}
  input,select{width:100%;background:#0e1218;border:1px solid var(--line);border-radius:5px;color:var(--text);padding:7px 10px;font-size:.95em}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  button{background:var(--acc);border:none;border-radius:6px;color:#0d1a16;font-weight:600;padding:9px 16px;cursor:pointer;font-size:.9em}
  button.secondary{background:var(--line);color:var(--text)}
  button:disabled{opacity:.5;cursor:not-allowed}
  #status-line{font-size:.85em;color:var(--dim);margin-top:8px}
  #status-line.connected{color:var(--acc)}
  #debug-status-line{font-size:.85em;color:var(--dim)}
  #debug-status-line.connected{color:var(--acc)}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th{text-align:left;font-size:.75em;color:var(--dim);padding:4px 6px;border-bottom:1px solid var(--line)}
  td{padding:5px 6px;border-bottom:1px solid #1e242c;font-size:.9em}
  tr.review td, tr.invalid td{background:#2a1a1a}
  .flag-ok{color:var(--acc)}
  .flag-review{color:var(--warn)}
  .flag-invalid{color:var(--err)}
  .correct-input{width:70px;display:inline-block;padding:3px 6px;font-size:.85em}
  .msg{margin-top:10px;padding:8px 12px;border-radius:5px;font-size:.85em;display:none}
  .msg.err{background:#3a1a1a;color:#ef9a9a;display:block}
  .msg.ok{background:#1a3a2a;color:#81c784;display:block}
  #ps-serial-info{font-size:.8em;margin-top:4px;min-height:1.2em}
  #ps-serial-info.found{color:var(--acc)}
  #ps-serial-info.notfound{color:var(--dim)}
  #debug-log{background:#0e1218;border:1px solid var(--line);border-radius:5px;height:180px;overflow-y:auto;font-family:monospace;font-size:.78em;padding:6px 8px;margin-top:8px}
  #debug-log div.tx{color:#7db8e8}
  #debug-log div.rx{color:#8ce8a0}
</style>
</head>
<body>
<h1>Disag-Wertmaschine</h1>

<div class="card" id="start-card">
  <label for="mode">Modus</label>
  <select id="mode" onchange="updateModeFields()">
    <option value="preisschiessen">Preisschießen-Scheibe</option>
    <option value="rundenwettkampf">Rundenwettkampf</option>
  </select>

  <div id="fields-preisschiessen">
    <label for="ps-id">Preisschießen</label>
    <select id="ps-id" onchange="onSerialInput()"><option value="">– laden... –</option></select>
    <label for="ps-serial">Seriennummer der Papierscheibe</label>
    <input type="text" id="ps-serial" placeholder="z.B. 00042" oninput="onSerialInput()">
    <div id="ps-serial-info"></div>
  </div>
  <div id="fields-rundenwettkampf" style="display:none">
    <label for="starter-id">Starter-ID</label>
    <input type="text" id="starter-id" placeholder="UUID">
  </div>

  <div class="row" style="margin-top:14px">
    <button onclick="startSession()">Starten</button>
    <button class="secondary" onclick="enterFernMode()"
            title="Versetzt die Wertmaschine in den Fernsteuermodus (RM III: &quot;V&quot;; RMIII-Win: &quot;W&quot; + Umschalten auf 38400 Baud). Am Display der Wertmaschine ablesen, ob/wann das noetig ist.">
      Fern
    </button>
  </div>
  <div id="start-msg" class="msg"></div>
</div>

<div class="card" id="live-card" style="display:none">
  <div id="status-line">–</div>
  <table>
    <thead><tr><th>#</th><th>Ring</th><th>Zehntel</th><th>Flag</th><th>Korrektur</th></tr></thead>
    <tbody id="shots-tbody"></tbody>
  </table>
  <div class="row" style="margin-top:14px">
    <button id="submit-btn" onclick="submitResult()">Abschließen & übertragen</button>
    <button class="secondary" onclick="abortSession()">Abbrechen</button>
    <button class="secondary" onclick="recoverMachine()" title="Wertmaschine reagiert nicht (z.B. nach unklarer Karte) - ohne Aus-/Einschalten zuruecksetzen">Wertmaschine zurücksetzen</button>
  </div>
  <div id="live-msg" class="msg"></div>
</div>

<div class="card" id="debug-card" style="display:none">
  <div id="debug-status-line">–</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
    <strong style="font-size:.85em;color:var(--dim)">Entwickler-Debug: Serielle Kommunikation</strong>
    <button class="secondary" style="padding:3px 10px;font-size:.8em" onclick="document.getElementById('debug-log').innerHTML=''">leeren</button>
  </div>
  <div id="debug-log"></div>
  <div class="row" style="margin-top:8px">
    <input type="text" id="raw-cmd" placeholder="Rohbefehl, z.B. WID oder ABR" style="flex:2">
    <button class="secondary" style="flex:1" onclick="sendRawCmd()">Senden</button>
  </div>
</div>

<script>
let state = { shots: [] };

function updateModeFields() {
  const mode = document.getElementById('mode').value;
  document.getElementById('fields-preisschiessen').style.display = mode === 'preisschiessen' ? 'block' : 'none';
  document.getElementById('fields-rundenwettkampf').style.display = mode === 'rundenwettkampf' ? 'block' : 'none';
}

async function loadPreisschiessenListe() {
  const sel = document.getElementById('ps-id');
  try {
    const res = await fetch('/preisschiessen-liste');
    const list = await res.json();
    if (!res.ok) throw new Error((list && list.error) || res.status);
    sel.innerHTML = list.length
      ? list.map(p => `<option value="${p.id}">${escapeHTML(p.name)}</option>`).join('')
      : '<option value="">– keine aktiven Preisschießen –</option>';
  } catch (err) {
    sel.innerHTML = '<option value="">– Fehler beim Laden –</option>';
  }
}

function escapeHTML(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type;
}

let serialCheckTimer = null;

// onSerialInput zeigt live den Namen der Scheibe (und des Schuetzen) neben
// dem Seriennummer-Feld an, sobald eine passende gekaufte Papierscheibe zum
// gewaehlten Preisschiessen gefunden wird - damit der Bediener bestaetigen
// kann, die richtige Karte vor sich zu haben, bevor er einliest.
function onSerialInput() {
  clearTimeout(serialCheckTimer);
  const info = document.getElementById('ps-serial-info');
  const psID = document.getElementById('ps-id').value;
  const serial = document.getElementById('ps-serial').value.trim();
  if (!psID || !serial) { info.textContent = ''; info.className = ''; return; }
  serialCheckTimer = setTimeout(async () => {
    try {
      const res = await fetch(`/scheibe-lookup?preisschiessen_id=${encodeURIComponent(psID)}&physical_serial_no=${encodeURIComponent(serial)}`);
      const j = await res.json();
      if (!res.ok) throw new Error(j.error || res.status);
      info.textContent = `${j.scheibe_name} – ${j.shooter_name}`;
      info.className = 'found';
    } catch (err) {
      info.textContent = 'keine Scheibe mit dieser Seriennummer gefunden';
      info.className = 'notfound';
    }
  }, 300);
}

async function startSession() {
  const mode = document.getElementById('mode').value;
  try {
    if (mode === 'preisschiessen') {
      await postJSON('/start/preisschiessen', {
        PreisschiessenID: document.getElementById('ps-id').value.trim(),
        PhysicalSerial: document.getElementById('ps-serial').value.trim(),
      });
    } else {
      await postJSON('/start/rundenwettkampf', {
        StarterID: document.getElementById('starter-id').value.trim(),
      });
    }
    document.getElementById('live-card').style.display = 'block';
    showMsg('start-msg', '', '');
    document.getElementById('start-msg').style.display = 'none';
  } catch (err) {
    showMsg('start-msg', 'Fehler: ' + err.message, 'err');
  }
}

async function submitResult(confirmOverwrite) {
  try {
    await postJSON('/submit', { ConfirmOverwrite: !!confirmOverwrite });
    document.getElementById('live-card').style.display = 'none';
    showMsg('start-msg', 'Übertragen.', 'ok');
    // Seriennummer (und Anzeige) leeren, damit die naechste Karte ohne
    // manuelles Aufraeumen eingetippt werden kann.
    document.getElementById('ps-serial').value = '';
    document.getElementById('ps-serial-info').textContent = '';
    document.getElementById('ps-serial-info').className = '';
  } catch (err) {
    if (String(err.message).includes('bereits ein Ergebnis') && !confirmOverwrite) {
      if (confirm('Es liegt bereits ein Ergebnis vor. Überschreiben?')) return submitResult(true);
      return;
    }
    showMsg('live-msg', 'Fehler: ' + err.message, 'err');
  }
}

async function abortSession() {
  await postJSON('/abort', {});
  document.getElementById('live-card').style.display = 'none';
}

async function recoverMachine() {
  if (!confirm('Wertmaschine wirklich zurücksetzen? Dabei liest sie ihr Programm neu von Diskette ein (mechanischer Verschleiß) - nur bei tatsächlicher Blockade verwenden.')) return;
  try {
    await postJSON('/recover', {});
    showMsg('live-msg', 'Wertmaschine zurückgesetzt und neu konfiguriert.', 'ok');
  } catch (err) {
    showMsg('live-msg', 'Zurücksetzen fehlgeschlagen: ' + err.message, 'err');
  }
}

// enterFernMode: versetzt die Wertmaschine in den Fernsteuermodus - bei RM
// III "V", bei RMIII-Win "W" + Umschalten auf 38400 Baud (siehe
// session.go EnterFernMode). Ausschliesslich manuell ueber den "Fern"-
// Button ausgeloest (kein automatischer Trigger mehr beim Dienststart) -
// der Bediener sieht am Display der Wertmaschine, ob/wann das noetig ist.
// Blockiert bei RMIII-Win ca. 25s; der Fortschritt ist waehrenddessen live
// in #debug-status-line (per SSE, nur bei aktivem Entwicklermodus sichtbar)
// zu sehen.
async function enterFernMode() {
  try {
    await postJSON('/enter-fern-mode', {});
    showMsg('start-msg', 'Fernsteuermodus-Befehl gesendet.', 'ok');
  } catch (err) {
    showMsg('start-msg', 'Fehlgeschlagen: ' + err.message, 'err');
  }
}

// sendRawCmd: manueller Rohbefehl an die Wertmaschine (siehe web.go
// handleSendRaw/session.go SendRaw) - fuer schnelles Ausprobieren waehrend
// einer Live-Diagnose (z.B. "WID" statt des automatischen "ABR" bei einer
// Editier-Anfrage), ohne den Dienst neu zu starten. Ergebnis/Reaktion der
// Wertmaschine zeigt sich ueber #status-line bzw. das Debug-Log oben (RX).
async function sendRawCmd() {
  const input = document.getElementById('raw-cmd');
  const cmd = input.value.trim();
  if (!cmd) return;
  try {
    await postJSON('/send-raw', {cmd});
    input.value = '';
  } catch (err) {
    alert('Senden fehlgeschlagen: ' + err.message);
  }
}

async function correctShot(index) {
  const ring = parseFloat(document.getElementById('correct-ring-' + index).value);
  if (isNaN(ring)) { alert('Bitte einen Ringwert eingeben.'); return; }
  await postJSON('/correct', { Index: index, Ring: Math.round(ring), Decimal: ring });
}

async function postJSON(path, body) {
  const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || res.status);
  return j;
}

function flagLabel(f) {
  if (f === 'review') return 'prüfen';
  if (f === 'invalid') return 'ungültig';
  return 'ok';
}

function render() {
  document.getElementById('status-line').textContent =
    (state.connected ? 'Verbunden' : 'Nicht verbunden') + (state.status_msg ? ' – ' + state.status_msg : '');
  document.getElementById('status-line').className = state.connected ? 'connected' : '';

  const protoLabel = {rmiii: 'RM III (Fernsteuerung)', rmiv: 'RM III-Win', 'rmiii-win': 'RM III-Win'};
  document.getElementById('debug-status-line').textContent =
    `Protokoll: ${protoLabel[state.protocol] || state.protocol || '–'} · ${state.com_port || '–'}` +
    (state.status_msg ? ' – ' + state.status_msg : '');
  document.getElementById('debug-status-line').className = state.connected ? 'connected' : '';

  const tbody = document.getElementById('shots-tbody');
  tbody.innerHTML = (state.shots || []).map((s, i) => {
    const needsFix = (s.raw_flag === 'review' || s.raw_flag === 'invalid') && !s.corrected;
    const rowClass = needsFix ? s.raw_flag : '';
    // Vorschlagswert: die Wertmaschine liefert bei "review"-Schuessen (Flag
    // K, "muss kontrolliert werden") trotzdem einen gemessenen Ring-/
    // Zehntelwert mit (nur bei "invalid" - Flag U bzw. "0.0"/"-,-" - ist
    // kein Wert vorhanden) - als Startwert im Korrekturfeld vorbefuellen,
    // statt der Bedienperson eine komplett leere Eingabe zuzumuten.
    const suggested = s.decimal ?? s.ring ?? '';
    const correctionCell = needsFix
      ? `<input type="number" step="0.1" class="correct-input" id="correct-ring-${i}" placeholder="Ring" value="${suggested}">
         <button class="secondary" style="padding:3px 8px" onclick="correctShot(${i})">OK</button>`
      : (s.corrected ? '(korrigiert)' : '');
    return `<tr class="${rowClass}">
      <td>${i + 1}</td>
      <td>${s.ring ?? '–'}</td>
      <td>${s.decimal ?? '–'}</td>
      <td class="flag-${s.raw_flag}">${flagLabel(s.raw_flag)}</td>
      <td>${correctionCell}</td>
    </tr>`;
  }).join('');

  document.getElementById('submit-btn').disabled = (state.shots || []).some(
    s => (s.raw_flag === 'review' || s.raw_flag === 'invalid') && !s.corrected);

  document.getElementById('debug-card').style.display = state.dev_mode ? 'block' : 'none';
}

// appendDebugLine zeigt ein einzelnes TX/RX-Ereignis im Debug-Panel an -
// nur relevant, wenn der Entwicklermodus aktiv ist (siehe session.go
// pollDevMode/newMachine); das Panel selbst bleibt sonst ausgeblendet.
function appendDebugLine(msg) {
  const log = document.getElementById('debug-log');
  const el = document.createElement('div');
  el.className = msg.dir === 'TX' ? 'tx' : 'rx';
  el.textContent = `${msg.time} ${msg.dir}  ${msg.ascii}  (${msg.hex})`;
  log.appendChild(el);
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  if (atBottom) log.scrollTop = log.scrollHeight;
}

const es = new EventSource('/events');
es.addEventListener('state', e => { state = JSON.parse(e.data); render(); });
es.addEventListener('raw', e => appendDebugLine(JSON.parse(e.data)));

updateModeFields();
loadPreisschiessenListe();
fetch('/status').then(r => r.json()).then(s => { state = s; render(); if (s.mode) document.getElementById('live-card').style.display = 'block'; });
</script>
</body>
</html>
